---
# The Proxmox hypervisor itself. Bare metal, installed from the ISO —
# nothing here creates the machine, this only converges a running one.

# Proxmox's default is "auto", which stays silent on a host without a
# subscription — i.e. exactly this one. "always" makes pve-daily-update
# report pending packages every night.
#
# With no notification endpoint configured, these are delivered by
# Proxmox's built-in mail-to-root target: local sendmail to root's mailbox
# on the box (postfix is installed and running by default), readable with
# `mail`. No credentials, no external service, nothing to leak.
pve_notify_package_updates: always

# Extra apt origins added to unattended-upgrades as a drop-in.
#
# Debian-Security and Proxmox are already allowed by Debian's own shipped
# 50unattended-upgrades — this list is only what that file MISSES. APT
# config lists append across files, which is why this role never edits
# the vendor file.
unattended_extra_origins:
  # Tailscale ships from its own repo, so nothing in the default origins
  # matches it and the VPN client would otherwise never update. On a
  # single-node box you can physically reach, a broken tailscale update is
  # an inconvenience; a permanently stale one is a security hole.
  - "site=pkgs.tailscale.com"

# tailscale_hostname isn't declared here — the tailscale role defaults it
# to inventory_hostname, which is already "pve". Setting it again here
# would be the same value written twice, free to drift, for no gain.

# Apt repositories, applied by the pve_repos role before anything else
# touches apt. An out-of-the-box Proxmox enables the enterprise repos and
# has no subscription, so every apt operation 401s until this runs.
#
# `suites` is not listed per-entry — it is always the host's own Debian
# codename, read from facts, so it can't drift from the running release.
pve_repositories:
  - name: pve-enterprise
    uris: https://enterprise.proxmox.com/debian/pve
    components: [pve-enterprise]
    enabled: false

  - name: ceph
    uris: https://enterprise.proxmox.com/debian/ceph-squid
    components: [enterprise]
    enabled: false

  - name: proxmox
    uris: http://download.proxmox.com/debian/pve
    components: [pve-no-subscription]
    enabled: true

# ── Kiosk dashboard on the physically attached monitor ───────────────
#
# The screen is wired to this box, so the compositor and browser have to
# run here — a guest can't drive it without GPU passthrough, which would
# take the console away and buy nothing. The *data* is all local anyway.
#
# Whether it runs at all is service_enabled.kiosk, in
# group_vars/all/services.yml with every other service's switch. These are its
# settings, which are only consulted once it is on.

# Localhost only. Nothing about this is meant to be reachable off-box, so
# the port never leaves 127.0.0.1 and no firewall rule is needed. This is
# also why the control endpoints (approve an upgrade, reboot) need no
# authentication: reaching them means you are already root on this box or
# standing in front of the screen it drives.
kiosk_port: 8099
kiosk_dir: /opt/kiosk

# Also serve the dashboard on this host's tailnet address, so it can be read
# from a phone or a laptop at http://<host>.<tailnet_base_domain>:8099.
#
# The tailnet address specifically, never 0.0.0.0: the other interface is the
# LAN bridge every guest and every device in the house sits on, and binding
# everything would publish this to anything that joined the wifi. On the
# tailnet, being able to reach it already means something.
#
# No TLS. The tunnel already encrypts and authenticates at the WireGuard
# layer, so a certificate here is a second lock on the same door — and this
# repo's own rule is that a device wanting an HTTPS front door gets its own
# Caddy, which is a deliberate decision rather than a default.
#
# ⚠️ This does NOT make the reboot and upgrade buttons remotely usable. Those
# are pinned to 127.0.0.1 inside the daemon, so the page is readable from
# anywhere on the tailnet while the destructive actions still require the
# keyboard physically wired to this box.
kiosk_bind_tailnet: true

# ── Sampling cadence ─────────────────────────────────────────────────
#
# Three tiers, because the sources cost wildly different amounts. The old
# single 10s timer had to run at the speed of its slowest source, which is
# why the graphs were blocky: /proc/stat is free and `pvesh` is not.

# Local sysfs and /proc — CPU per core, memory, GPU, network counters.
# Costs nothing and is what makes a graph look like a line rather than a
# staircase.
kiosk_fast_seconds: 1

# Guests, via the Proxmox API. Measured on this box, each `pvesh` invocation
# costs about 0.7s of CPU — it is a Perl CLI that stands the whole Proxmox API
# stack up every time — so this interval is not free the way the /proc reads
# are. At 5s it burned roughly half a core continuously, which is an absurd
# price for a dashboard on a hypervisor. Guest figures do not meaningfully
# change inside 20s.
kiosk_guest_seconds: 20

# Guest introspection over the QEMU guest agent — filesystem usage and the
# container list inside each VM. Deliberately slower than the guest poll:
# it forks a process inside the guest, so it is the most expensive thing
# here and the answer changes rarely.
kiosk_agent_seconds: 20

# Tailnet, HTTPS probes, pending apt updates, failed units, PVE task log.
# All either shell out or touch the network.
kiosk_slow_seconds: 60

# How much history the daemon keeps in memory, per series. At
# kiosk_fast_seconds=1 this is a 10-minute window; nothing is written to
# disk, so a restart starts the graphs over.
kiosk_history_points: 600

# ── What the screen shows ────────────────────────────────────────────

# How often the page asks for new data. NOT how often the box is sampled —
# that stays kiosk_fast_seconds. The daemon hands back everything since the
# sequence the page last saw, so one request every 5s still returns five
# one-second samples and the graphs keep their resolution at a fifth of the
# requests.
kiosk_poll_seconds: 5

# The pointer used to hide itself after a spell of inactivity. Removed: with
# a mouse actually plugged in, an invisible cursor you have to move blindly
# to summon back is worse than a visible one nobody is looking at.

# The GPU's real product name. PCI ID 1002:67df is shared by the whole
# RX 470/480/570/580/590 family, so no amount of reading sysfs can narrow
# it down — the subsystem ID gets as far as "Sapphire Nitro+ RX 570/580/590"
# and the exact model is something only you know. Leave empty to show what
# the PCI database says.
kiosk_gpu_name: "Sapphire Nitro+ Radeon RX 580 4GB"

# Peers whose MagicDNS name is checked for a working HTTPS front door, on
# the kiosk_slow_seconds tick. Empty means every online peer is probed.
# The probe is a TCP connect to 443 plus a certificate read — no request is
# ever sent, so nothing is logged as traffic on the far end.
kiosk_https_check_hosts: []

# Tailnet hostnames to leave off the graph, as fnmatch patterns.
#
# CI joins the tailnet as an ephemeral node for the length of a deploy and
# headscale reaps it afterwards. Without this a machine called
# gh-runner-33068555390 appears on the screen for five minutes and is gone
# again before anyone can ask what it was.
kiosk_tailnet_hide:
  - "gh-runner-*"
  - "gh-check-*"

# What each tailnet node physically IS, so the graph can draw it as itself.
#
# Only needed where the kiosk cannot work it out. It already knows it is the
# server, and that a node matching one of its own guests is a VM; Tailscale's
# own data separates a phone from everything else and stops there, because a
# laptop, a Raspberry Pi and a hypervisor all report "linux".
#
# Recognised: server, vm, pi, laptop, phone, desktop.
kiosk_node_kinds:
  cachyos-laptop: laptop
  homeassistant: pi

# The ceiling the network graphs are drawn against, in bytes/sec.
#
# This box's NIC is 1 Gbit (nic0 reports 1000 Mb/s; vmbr0 claims 10000, which
# is a bridge reporting an aggregate it cannot actually reach). Scaling to the
# full line rate is honest and useless: ordinary traffic here is single-digit
# MB/s, which draws a flat line on the floor. Roughly a tenth of it makes
# everyday traffic legible, and anything faster clips at the top where you can
# still see it happened.
#
# Binary MB, because that is the unit the page prints everywhere else — as a
# decimal 12 500 000 this rendered as "11.9 MB/s" on a label claiming 12.5.
kiosk_net_scale_bytes: 13107200   # 12.5 MiB/s

# The interface the network graphs draw. vmbr0 is the bridge every guest and
# the host itself sit on, so it is the one number that means "this machine's
# traffic". tailscale0 is still collected and shown as a figure, but it is a
# subset of this one — a byte in the tunnel is counted again on the bridge,
# encrypted — so graphing both draws the same traffic twice.
kiosk_net_primary: vmbr0

# The Proxmox node name pvesh is queried for — not necessarily the same
# string as the tailnet hostname, though here they both happen to be "pve".
pve_node: pve

# ── Backups ──────────────────────────────────────────────────────────
#
# The jobs themselves are derived from pve_guests below — each guest carries
# its own `backup:` policy, so a vmid is written exactly once in this repo.
# A guest with no `backup:` key gets no job.
#
# `tank` — a ZFS pool on sda, a DIFFERENT physical disk from the sdb that holds
# pve-root and every guest disk. That is the entire point of the choice: a
# backup sitting on the same disk as the thing it backs up protects against
# mistakes only, never against that disk dying.
#
# ⚠️ NOT `local`. `local` is /var/lib/vz, which is on pve-root — the
# hypervisor's ROOT filesystem, 64G with ~42G free. This was the live setting
# until it was caught, and paired with uncompressed dumps (see below) it was
# roughly a week from filling root and taking Proxmox down with it, which is a
# far worse outage than a failed backup. See docs/vault.md.
pve_backup_storage: tank

# zstd, named explicitly because vzdump does NOT compress by default and the
# default is the expensive one. Measured on this host, same guest: raw .vma
# 4.88G, .vma.zst 1.77G. Leaving it unset is what made the retention below
# unaffordable.
pve_backup_compress: zstd

# Snapshot, not stop: the guest keeps running. Vaultwarden's SQLite database is
# in WAL mode and comes through consistently, and a nightly stop would be a
# scheduled outage of the one service you need at unpredictable times.
pve_backup_mode: snapshot

# ── Guests ───────────────────────────────────────────────────────────
#
# Created by the pve_guests role, which clones each one from a cloud-init
# template it builds once. Whether a guest exists at all is its `service` flag
# in group_vars/all/services.yml — switch that off and the VM is DESTROYED on
# the next run, disk included.
#
# This repo used OpenTofu for this briefly. It was dropped because the only
# thing it actually required was somewhere to keep a state file, and every
# option for that meant either a cloud bucket or a hand-managed service on the
# hypervisor — in a repo whose stated point is needing neither. A VM on a
# single node is flat parameters with no resource graph to model, and Ansible
# asks Proxmox what exists rather than remembering, which suits a box you will
# click around in by hand.

# How to reach the API. Only the token SECRET is a secret; it lives in
# secrets.yml with an assert in the role. These two are just names.
pve_api_host: pve.ts.conway-hash.com
pve_api_user: automation@pve
pve_api_token_id: homelab

# Proxmox ships a self-signed certificate, and this endpoint is only ever
# reached over the tailnet, which is already authenticated and encrypted at the
# WireGuard layer. Verifying a certificate nobody issued buys nothing.
pve_api_validate_certs: false

# ── The cloud-init template every guest is cloned from ───────────────
#
# Built once, ever. This is what makes adding the fifth service cheap: one
# clone task, not another image download and another disk import.
pve_template_vmid: 9000
pve_template_name: debian-13-cloudinit
pve_template_image_url: https://cloud.debian.org/images/cloud/trixie/latest/debian-13-genericcloud-amd64.qcow2
pve_template_image_path: /var/lib/vz/template/iso/debian-13-genericcloud-amd64.qcow2

# A full clone of a 20G disk takes a while on spinning storage.
pve_clone_timeout: 600

# ── Where guests land ────────────────────────────────────────────────

# Confirmed on the host: pve-data is an LVM-thin pool with ~97G free after
# VM 100's 32G, so `local-lvm` is the datastore and a 20G guest fits.
pve_vm_datastore: local-lvm

pve_bridge: vmbr0

# The home LAN, read off the host itself (vmbr0 is 1.1.1.210/24, default route
# via 1.1.1.254). Guests get a static address rather than a lease, because
# Ansible reaches them by ProxyJump through the hypervisor and has to know the
# address before the machine has ever booted.
#
# ⚠️ This LAN uses 1.1.1.0/24, which overlaps Cloudflare's public 1.1.1.1
# resolver. Nothing here depends on reaching that address — guests resolve
# through Tailscale MagicDNS once joined, and the gateway before that — but if
# DNS ever behaves strangely on a guest, this overlap is the first suspect.
pve_lan_cidr_prefix: 24
pve_lan_gateway: 1.1.1.254

# The gateway, which is what the host's own LAN clients use. Only needed for
# the window between first boot and the tailscale role running; after that
# MagicDNS takes over.
pve_lan_dns_servers: 1.1.1.254

# Seconds Proxmox waits after starting a guest before starting the next, and
# how long it waits for one to shut down. Not cosmetic: a guest's clock, its
# tailnet join and Caddy's ACME renewal all want the host's networking settled
# first.
pve_guest_up_delay: 30
pve_guest_down_delay: 60

# ── The guests themselves ────────────────────────────────────────────
#
# `service` must match a key in group_vars/all/services.yml.
#
# ── vmid allocation ──
#
# Machines this repo creates are numbered from 999 DOWNWARD: 999, 998, 997...
# The 100-range is left alone for guests created by hand — VM 100 (Obsidian
# sync) is there for legacy reasons and is not managed here.
#
# Starting from opposite ends means the two allocations cannot collide as
# either grows, and the number itself tells you at a glance which side created
# a VM: low means someone clicked it, high means this repo owns it and will
# happily destroy it when its switch goes false.
#
# 9000 is the cloud-init template, deliberately far from both.
pve_guests:
  - name: vault
    service: vault
    vmid: 999
    cores: 2
    memory_mb: 2048
    disk_gb: 20
    # Deliberately below 1.1.1.100: consumer routers typically hand out
    # .100-.199 or higher, so a static in that range risks a lease collision
    # that only shows up as an intermittent, confusing outage. Confirmed free
    # (no ARP reply) at the time this was set.
    ipv4: 1.1.1.21
    startup_order: 10
    # A vault with no backup is one disk away from every password being gone,
    # and unlike most services there is no re-deriving the contents.
    # Systemd calendar syntax, not cron.
    backup:
      schedule: "03:30"
      # One rolling week: seven dailies, and the eighth night drops the oldest.
      # No weeklies or monthlies. A password vault's useful restore window is
      # "before I broke something", which is measured in days — a month-old
      # archive is a vault missing every password added since, and restoring it
      # would lose more than it recovers.
      keep_daily: 7
