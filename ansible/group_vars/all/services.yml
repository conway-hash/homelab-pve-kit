---
# Which services this host runs. THE place to turn something on or off.
#
# Every service in this repo is optional and off-able. Nothing outside this
# file needs editing to drop one: pve_guests removes its guest, site.yml stops
# converging it, and CI stops deploying to it — all three read this same map,
# so there is no second switch anywhere to forget.
#
# A service set to false is not merely skipped at the end. The gate is at the
# role, so nothing gets installed, no unit is written, and no package is
# pulled. Turning one off after the fact does NOT uninstall what a previous run
# already put there — see docs/README.md for what removing a service actually
# takes.
#
# Adding a service means adding a line here, and its name has to match the
# guest group in inventory (`<name>_host`) — CI derives its deploy matrix from
# exactly that pairing and fails loudly if a group has no line here.
#
# `service_enabled`, not `services`: with inject_facts_as_vars on (the
# default), a bare `services` would be shadowed the moment any play gathers
# service facts.
service_enabled:
  # Runs ON the hypervisor. The monitor is physically wired to that box, so
  # there is no guest to create — this is purely a role toggle. All it does is
  # point a browser at the watch dashboard. See docs/screen.md.
  #
  # ⚠️ OFF until `watch` is on, and deliberately in that order: this role points
  # the screen at watch.ts.… and removes the kiosk. Enabling it first would
  # uninstall a working dashboard and replace it with an error page. Until then
  # the retired kiosk keeps running on the host untouched — Ansible has no undo,
  # which is the one time that works in your favour.
  screen: false

  # Its own guest, VM 998. The homelab's push notification server — where every
  # service sends its alerts, and what the ntfy app on your phone subscribes to.
  #
  # Its own guest rather than a container inside whichever service wanted it
  # first: notifications are infrastructure, and binding them to one service
  # would mean disabling that service silently disables alerting for all the
  # others.
  #
  # Turning this off DESTROYS VM 998 on the next run of the hypervisor play.
  # Nothing else breaks — watchd keeps collecting and the dashboard keeps
  # serving — but every alert is dropped, silently, which is the worst way for
  # a monitoring system to fail. See docs/ntfy.md.
  #
  ntfy: true

  # Its own guest, VM 997. Reads the hypervisor over the Proxmox API, decides
  # what needs doing, pushes it to `notify`, and serves the dashboard the
  # physical screen shows.
  #
  # Replaced the kiosk, which did the same job on the hypervisor itself and
  # could only afford to look every 20 seconds because `pvesh` forks a Perl
  # process per call. See docs/watch.md.
  #
  # Turning this off DESTROYS VM 997 on the next run of the hypervisor play,
  # and leaves the monitor showing an error page unless `screen` goes with it.
  #
  # ⚠️ OFF until its credentials exist, and turn `notify` on first or the first
  # alerts have nowhere to go. It needs its OWN Proxmox token — not the
  # privsep-0 one that creates guests. See "Before you turn it on" in
  # docs/watch.md.
  watch: false

  # Its own guest, VM 999. Turning this off DESTROYS that VM on the next run
  # of the hypervisor play — use --check --diff first if you want warning.
  # See docs/vault.md.
  vault: true
