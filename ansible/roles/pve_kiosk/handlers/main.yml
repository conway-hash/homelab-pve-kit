---
- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Restart kiosk data timer
  ansible.builtin.systemd_service:
    name: kiosk-data.timer
    state: restarted
  # Only meaningful once the unit exists; on the very first run the
  # enable task below creates it anyway.
  failed_when: false
