<!DOCTYPE html>
<!--
  Managed by Ansible (svc_watch) — edits will be overwritten.

  Mobile-first on purpose. The overwhelmingly common way this page gets opened
  is tapping a notification on a phone that is already telling you something is
  wrong, so what must be legible at a glance, one-handed, is the alert list —
  not the graphs. The desktop layout is the same page with more columns.

  No framework and no build step. Everything here is one file served by watchd
  itself; a bundler would add a toolchain to a repo whose stated point is not
  needing one.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>watch</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --line: #262b36;
    --text: #e6e9ef; --dim: #9aa3b2;
    --ok: #3fb950; --info: #58a6ff; --warn: #d29922; --crit: #f85149;
    --radius: 10px;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f6f7f9; --panel: #ffffff; --line: #e2e5ea;
      --text: #12151a; --dim: #5b6472;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: 0 16px env(safe-area-inset-bottom) 16px;
  }
  header {
    position: sticky; top: 0; z-index: 5; background: var(--bg);
    padding: 14px 0 10px; border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  }
  h1 { font-size: 17px; margin: 0; font-weight: 650; letter-spacing: .2px; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em;
       color: var(--dim); margin: 22px 0 8px; font-weight: 600; }
  .spacer { flex: 1; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); }
  .dot.live { background: var(--ok); }
  .dot.stale { background: var(--crit); }
  #meta { color: var(--dim); font-size: 12px; font-variant-numeric: tabular-nums; }

  select {
    background: var(--panel); color: var(--text); border: 1px solid var(--line);
    border-radius: 8px; padding: 6px 8px; font: inherit; font-size: 13px;
  }

  .card {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 12px 14px; margin-bottom: 10px;
  }
  .grid { display: grid; gap: 10px; grid-template-columns: 1fr; }
  @media (min-width: 720px) { .grid.two { grid-template-columns: 1fr 1fr; } }
  @media (min-width: 1040px) { .grid.three { grid-template-columns: repeat(3, 1fr); } }

  .row { display: flex; align-items: baseline; gap: 8px; }
  .name { font-weight: 600; }
  .muted { color: var(--dim); font-size: 13px; }
  .num { font-variant-numeric: tabular-nums; }

  .bar { height: 6px; border-radius: 3px; background: var(--line);
         overflow: hidden; margin-top: 7px; }
  .bar > i { display: block; height: 100%; background: var(--info); }
  .bar > i.warn { background: var(--warn); }
  .bar > i.crit { background: var(--crit); }

  .alert { border-left: 3px solid var(--dim); padding: 9px 12px; margin-bottom: 8px;
           background: var(--panel); border-radius: 0 var(--radius) var(--radius) 0; }
  .alert.info { border-left-color: var(--info); }
  .alert.warn { border-left-color: var(--warn); }
  .alert.critical { border-left-color: var(--crit); }
  .alert .t { font-weight: 620; }
  .alert .b { color: var(--dim); font-size: 13px; white-space: pre-line; margin-top: 2px; }

  .pill { font-size: 11px; padding: 2px 7px; border-radius: 999px;
          border: 1px solid var(--line); color: var(--dim); }
  .pill.run { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 40%, var(--line)); }
  .pill.off { color: var(--crit); border-color: color-mix(in srgb, var(--crit) 40%, var(--line)); }

  svg.spark { display: block; width: 100%; height: 34px; margin-top: 8px; }

  .allclear { color: var(--ok); }
  footer { color: var(--dim); font-size: 12px; padding: 20px 0 28px; }
  code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
</style>
</head>
<body>

<header>
  <span class="dot" id="live"></span>
  <h1>watch</h1>
  <span class="spacer"></span>
  <label class="muted" for="iv">every</label>
  <select id="iv" aria-label="Refresh interval">
    <option value="1">1s</option>
    <option value="5">5s</option>
    <option value="10" selected>10s</option>
    <option value="30">30s</option>
    <option value="60">60s</option>
  </select>
</header>

<div id="meta"></div>

<h2 id="alerts-h">Needs attention</h2>
<div id="alerts"></div>

<h2>Host</h2>
<div id="host" class="grid three"></div>

<h2>Guests</h2>
<div id="guests" class="grid two"></div>

<h2>Storage</h2>
<div id="storage" class="grid two"></div>

<h2>Certificates</h2>
<div id="certs" class="grid two"></div>

<footer id="foot"></footer>

<script>
"use strict";

// The client picker controls how often THIS PAGE asks. The server decides how
// often it samples — and it uses the interval we send to speed itself up while
// someone is watching, then falls back to its idle rate once we stop asking.
// Sending it is what makes the picker mean anything; without that, choosing 1s
// would just re-request the same 60-second-old numbers sixty times.
const $ = (id) => document.getElementById(id);
const LS_KEY = "watch.interval";

let seq = 0;
let timer = null;
let lastOk = 0;
const hist = [];
const HIST_MAX = 600;

function interval() { return parseInt($("iv").value, 10) || 10; }

// A per-viewer convenience only, and wrapped because storage throws in a
// private window and returns nothing in a preview. The page must render
// correctly when it is unavailable.
try {
  const saved = localStorage.getItem(LS_KEY);
  if (saved && [...$("iv").options].some(o => o.value === saved)) $("iv").value = saved;
} catch (e) { /* no-op */ }

$("iv").addEventListener("change", () => {
  try { localStorage.setItem(LS_KEY, $("iv").value); } catch (e) { /* no-op */ }
  schedule(true);
});

const bytes = (n) => {
  if (!n) return "0 B";
  const u = ["B", "KiB", "MiB", "GiB", "TiB"];
  const i = Math.min(u.length - 1, Math.floor(Math.log(n) / Math.log(1024)));
  return (n / Math.pow(1024, i)).toFixed(i ? 1 : 0) + " " + u[i];
};

const dur = (s) => {
  if (!s) return "—";
  const d = Math.floor(s / 86400), h = Math.floor((s % 86400) / 3600);
  return d ? `${d}d ${h}h` : `${h}h ${Math.floor((s % 3600) / 60)}m`;
};

const cls = (pct) => (pct >= 90 ? "crit" : pct >= 80 ? "warn" : "");

function meter(label, value, pct, extra, sparkline) {
  return `<div class="card">
    <div class="row"><span class="name">${esc(label)}</span><span class="spacer"></span>
      <span class="num muted">${esc(value)}</span></div>
    <div class="bar"><i class="${cls(pct)}" style="width:${Math.min(100, pct)}%"></i></div>
    ${extra ? `<div class="muted" style="margin-top:6px">${extra}</div>` : ""}
    ${sparkline || ""}
  </div>`;
}

// A sparkline, not a chart library. One path, no axes: the question this
// answers is "is it moving", and anything more detailed belongs on a page
// someone is actually sitting in front of.
function spark(values) {
  if (values.length < 2) return "";
  const w = 240, h = 34, max = Math.max(10, ...values);
  const pts = values.map((v, i) => {
    const x = (i / (values.length - 1)) * w;
    const y = h - (v / max) * (h - 2) - 1;
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(" ");
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true">
    <polyline points="${pts}" fill="none" stroke="var(--info)" stroke-width="1.5"
      vector-effect="non-scaling-stroke"/></svg>`;
}

function render(d) {
  const s = d.latest || {};
  if (!s.host) return;

  const alerts = d.alerts || [];
  const order = { critical: 0, warn: 1, info: 2 };
  alerts.sort((a, b) => (order[a.level] ?? 9) - (order[b.level] ?? 9));

  $("alerts-h").textContent = alerts.length ? `Needs attention (${alerts.length})` : "Needs attention";
  $("alerts").innerHTML = alerts.length
    ? alerts.map(a => `<div class="alert ${a.level}">
        <div class="t">${esc(a.title)}</div><div class="b">${esc(a.body)}</div></div>`).join("")
    : `<div class="card allclear">Nothing needs doing.</div>`;

  $("host").innerHTML =
    meter("CPU", s.host.cpu.toFixed(1) + "%", s.host.cpu,
          `${esc(s.host.cores || "?")} threads · load ${esc((s.host.loadavg || []).join(" "))}`,
          spark(hist.map(h => h.cpu))) +
    meter("Memory", `${bytes(s.host.memory.used)} / ${bytes(s.host.memory.total)}`,
          s.host.memory.pct, `${s.host.memory.pct}%`,
          spark(hist.map(h => h.mem))) +
    meter("Root filesystem", `${bytes(s.host.rootfs.used)} / ${bytes(s.host.rootfs.total)}`,
          s.host.rootfs.pct,
          `up ${dur(s.host.uptime)} · ${esc(s.host.kernel?.release || "")}`);

  $("guests").innerHTML = (s.guests || []).map(g => {
    // backup_last, not backups: archives need a privilege this token
    // deliberately does not hold, so the authoritative source is usually the
    // vzdump task log. Which one answered is shown, because an archive proves
    // you can restore and a task only proves something reported success.
    const b = (s.backup_last || {})[String(g.vmid)];
    const age = b ? ((Date.now() / 1000 - b.t) / 86400) : null;
    return `<div class="card">
      <div class="row"><span class="name">${esc(g.name)}</span>
        <span class="muted num">${g.vmid}</span><span class="spacer"></span>
        <span class="pill ${g.running ? "run" : "off"}">${esc(g.status)}</span></div>
      <div class="muted" style="margin-top:6px">
        cpu ${g.cpu.toFixed(1)}% · mem ${g.memory.pct}% (${bytes(g.memory.used)})
        · up ${dur(g.uptime)}</div>
      <div class="muted">backup ${age === null ? "— none" :
        age.toFixed(1) + " days old (" + esc(b.source) + ")"}</div>
      <div class="bar"><i class="${cls(g.memory.pct)}" style="width:${g.memory.pct}%"></i></div>
    </div>`;
  }).join("") || `<div class="card muted">No guests.</div>`;

  $("storage").innerHTML = (s.storage || []).map(v =>
    meter(v.name, `${bytes(v.used)} / ${bytes(v.total)}`, v.pct, `${v.type} · ${v.pct}%`)
  ).join("");

  $("certs").innerHTML = (s.certs || []).map(c => `<div class="card">
    <div class="row"><span class="name">${esc(c.host)}</span><span class="spacer"></span>
      <span class="num muted">${c.days === null ? "unreadable" : c.days.toFixed(0) + " days"}</span>
    </div></div>`).join("") || `<div class="card muted">No certificates checked.</div>`;

  const u = s.updates || {};
  $("foot").innerHTML =
    `${esc(s.host.pveversion || "")} · ${u.count || 0} update(s) pending` +
    (u.kernel?.length ? ` · kernel: ${esc(u.kernel.join(", "))}` : "") +
    (d.meta?.ntfy_topic ? ` · alerts → <code>${esc(d.meta.ntfy_topic)}</code>` : "");

  const age = (Date.now() / 1000) - (s.generated || 0);
  $("meta").textContent =
    `sampled ${age < 2 ? "just now" : Math.round(age) + "s ago"} · seq ${d.seq}`;
}

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

async function poll() {
  try {
    const r = await fetch(`/api/state?since=${seq}&interval=${interval()}`, { cache: "no-store" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    const d = await r.json();
    seq = d.seq || seq;
    for (const h of (d.history || [])) {
      hist.push(h);
      if (hist.length > HIST_MAX) hist.shift();
    }
    render(d);
    lastOk = Date.now();
    $("live").className = "dot live";
  } catch (e) {
    // A failed poll is not a reason to blank the page — the last known state is
    // still the most useful thing on screen. The dot going red is the signal.
    if (Date.now() - lastOk > 15000) $("live").className = "dot stale";
  }
}

function schedule(immediate) {
  if (timer) clearInterval(timer);
  if (immediate) poll();
  timer = setInterval(poll, interval() * 1000);
}

// Stop polling when the tab is hidden. On a phone this is what stops a page you
// opened from a notification and then pocketed from holding the server at 1s
// sampling all afternoon.
document.addEventListener("visibilitychange", () => {
  if (document.hidden) { clearInterval(timer); timer = null; }
  else schedule(true);
});

schedule(true);
</script>
</body>
</html>
