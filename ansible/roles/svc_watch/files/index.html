<!doctype html>
<!--
  Managed by Ansible (svc_watch) — edits will be overwritten.

  This is the pve_kiosk dashboard, kept. Same layout, same colour-per-resource
  rule, same cards — moved onto watchd's data and reworked for a phone, which
  is now the screen it is most often opened on because a notification put it
  there.

  Three panels from the original are gone, and none of them by preference. GPU,
  per-core CPU and CPU temperature came from /proc and sysfs on the hypervisor,
  which a guest cannot read; the tailnet graph came from `tailscale status`,
  which is not in the Proxmox API either. What is left is everything the API
  will actually answer for — which turned out to include host network history
  and a pending-reboot signal, both of which looked unavailable until checked.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>watch</title>
<!-- Inline, so it costs no request and there is no asset to deploy alongside
     the page. Green when it loads; the tab title is what tells you more. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23101722'/%3E%3Cpath d='M5 20 L11 20 L14 11 L18 24 L21 17 L27 17' fill='none' stroke='%234ec9a5' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23101722'/%3E%3Cpath d='M5 20 L11 20 L14 11 L18 24 L21 17 L27 17' fill='none' stroke='%234ec9a5' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<meta name="theme-color" content="#101722">
<style>

/* One colour per resource, so a graph is identifiable without reading its
   label. Red is NOT in that set — it is reserved for a threshold being hit,
   which is why nothing is red until something is wrong. */
:root{
  --bg:#080b11; --card:#101722; --card2:#0c121a; --box:#0a1017;
  --line:#1e2836; --line2:#161e29;
  --fg:#dde5f0; --mut:#8494a8; --dim:#41505f;
  --cpu:#4c9aff; --mem:#4ec9a5;
  --dn:#e07ab0; --up:#9b8cff; --sto:#e0913f;
  --good:#4ec9a5; --warn:#e0a34a; --bad:#e05c5c;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:radial-gradient(1200px 640px at 78% -16%,#131e2c 0%,transparent 60%),var(--bg);
     color:var(--fg);overflow:hidden;font:13px/1.5 "DejaVu Sans",system-ui,sans-serif}
.mono{font-family:"DejaVu Sans Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}

#app{height:100vh;display:grid;gap:10px;padding:10px;
     grid-template-columns:352px minmax(0,1.05fr) minmax(0,1.5fr) minmax(0,.5fr);
     grid-template-rows:auto minmax(0,1fr) minmax(0,1fr);
     grid-template-areas:
       "top top  top   top"
       "sys vms  tnet  bkp"
       "sys vms  logs  notif";}
.card{background:linear-gradient(180deg,var(--card),var(--card2));border:1px solid var(--line);
      border-radius:11px;padding:12px 14px;overflow:hidden;position:relative;
      display:flex;flex-direction:column;min-height:0}
.t{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);
   margin-bottom:10px;display:flex;align-items:center;gap:9px;flex:none}
.t::after{content:"";flex:1;height:1px;background:var(--line)}
.scroll{overflow-y:auto;flex:1;min-height:0;scrollbar-width:thin;
        scrollbar-color:var(--line) transparent}

/* ── header ───────────────────────────────────────────────────── */
#top{grid-area:top;display:grid;grid-template-columns:1fr auto 1fr;
     align-items:center;padding:9px 16px;gap:10px}
#brand{font-size:19px;font-weight:600;color:var(--fg);white-space:nowrap}
#brand em{font-style:normal;color:var(--dim);font-weight:400;margin-left:7px;font-size:13px}
#pills{justify-self:center;display:flex;gap:8px;align-items:center;flex-wrap:wrap;
       justify-content:center}
.pill{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--mut);
      background:#0b1118;border:1px solid var(--line);border-radius:99px;
      padding:5px 11px;white-space:nowrap}
.pill b{font-weight:600;color:var(--fg)}
button.pill{font:inherit;font-size:11.5px;cursor:pointer}
button.pill:hover{border-color:var(--fg)}
.led{width:7px;height:7px;border-radius:50%;background:var(--dim);flex:none}
.led.ok{background:var(--good)}
.led.warn{background:var(--warn)}
.led.bad{background:var(--bad);animation:blink 1.1s steps(1,end) infinite}
@keyframes blink{50%{opacity:.25}}
#when{justify-self:end;text-align:right;line-height:1.12}
#clock{font-size:30px;font-weight:600;letter-spacing:-.01em}
#date{font-size:15px;font-weight:500;color:var(--mut)}
#date b{color:var(--fg);font-weight:600}

/* ── one dark box per resource ────────────────────────────────── */
#sys{grid-area:sys}
.blk{background:var(--box);border:1px solid var(--line2);border-radius:8px;
     padding:10px 12px;margin-bottom:9px}
.blk:last-child{margin-bottom:2px}
.bh{display:flex;align-items:baseline;gap:8px}
.bh .l{font-size:11px;letter-spacing:.16em;text-transform:uppercase;
       font-weight:600;flex:none}
.bh .hw{margin-left:auto;font-size:10px;color:var(--dim);
        overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.big{font-size:25px;font-weight:600;line-height:1.15;margin:2px 0 4px}
.big small{font-size:12px;color:var(--mut);font-weight:400;margin-left:2px}
.big .side{float:right;font-size:12px;color:var(--mut);font-weight:400;margin-top:10px}
.big .side b{color:var(--fg);font-weight:600}
.chart{width:100%;display:block}

/* Two fixed columns, tabular values. A number going from 9 W to 146 W moves
   nothing else — the GPU rows used to reflow while being read. */
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));
       gap:1px 12px;margin-top:5px}
.stats div{display:flex;justify-content:space-between;gap:6px;
           font-size:10.5px;color:var(--mut);white-space:nowrap}
.stats b{color:var(--fg);font-weight:600;
         font-family:"DejaVu Sans Mono",ui-monospace,monospace;
         font-variant-numeric:tabular-nums}

.trk{height:5px;background:#070b10;border-radius:3px;overflow:hidden}
.trk>i{display:block;height:100%;border-radius:3px;width:0;
       transition:width .6s ease,background .4s}


.nrow{margin-bottom:7px}
.nrow:last-child{margin-bottom:0}
.nrow .hd{display:flex;align-items:baseline;gap:7px;font-size:10.5px;color:var(--mut)}
.nrow .hd b{margin-left:auto;color:var(--fg);font-weight:600;
            font-family:"DejaVu Sans Mono",ui-monospace,monospace;
            font-variant-numeric:tabular-nums}

.fs{margin-bottom:9px}
.fs:last-child{margin-bottom:0}
.fs .r1{display:flex;align-items:baseline;gap:7px;font-size:12px}
.fs .r1 .ty{font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);
            border:1px solid var(--line);border-radius:3px;padding:0 4px}
.fs .r1 .pc{margin-left:auto;font-weight:600;color:var(--fg)}
.fs .r2{font-size:10.5px;color:var(--mut);display:flex;gap:8px;margin-top:3px}
.fs .r2 .dev{color:var(--dim);margin-left:auto}

/* ── guests ───────────────────────────────────────────────────── */
#vms{grid-area:vms}
#tabs{display:flex;gap:5px;margin-bottom:9px;flex:none}
.tab{flex:1;border:1px solid var(--line);background:var(--box);border-radius:7px;
     padding:9px 10px;cursor:pointer;text-align:left;color:var(--mut);
     font:inherit;font-size:10px;letter-spacing:.1em;text-transform:uppercase;
     transition:color .2s,border-color .2s,opacity .2s}
.tab b{display:block;font-size:17px;letter-spacing:0;color:var(--fg);font-weight:600}
/* White, not blue: selection is not a measurement, and blue is the CPU. */
.tab.on{border-color:var(--fg);color:var(--fg)}
.tab.empty{opacity:.34}
.tab.empty b{color:var(--dim)}

.g{background:var(--box);border:1px solid var(--line2);border-radius:8px;
   padding:10px 12px;margin-bottom:9px}
.g.off{opacity:.55}
.gh{display:flex;align-items:center;gap:7px}
.gh .n{font-weight:600;font-size:14px}
.gh .up{margin-left:auto;font-size:10.5px;color:var(--mut)}
.tag{font-size:9px;letter-spacing:.07em;text-transform:uppercase;color:var(--mut);
     border:1px solid var(--line);border-radius:4px;padding:0 5px}
.gdns{font-size:10px;color:var(--dim);margin-bottom:7px}
/* Divided off from the resource rows above it: those are "how is it doing
   right now", this is "could you get it back". Different question, and on a
   password vault the more important one. */
.bk{display:flex;align-items:center;gap:7px;margin-top:8px;padding-top:8px;
    border-top:1px solid var(--line)}
.bk .k{font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
.bk .bv{font-size:10.5px;margin-left:auto;
        font-family:"DejaVu Sans Mono",ui-monospace,monospace;
        font-variant-numeric:tabular-nums}
/* label · percent · bar · ceiling. The ceiling column is sized to content
   and right-aligned, so rows line up and nothing stretches. */
.vrow{display:grid;grid-template-columns:30px 40px minmax(0,1fr) auto;
      gap:8px;align-items:center;margin-bottom:5px}
.vrow:last-child{margin-bottom:0}
.vrow .k{font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
.vrow .pcv,.vrow .rt{font-size:11px;
     font-family:"DejaVu Sans Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
.vrow .pcv{color:var(--fg);text-align:right}
.vrow .rt{color:var(--mut);text-align:right;white-space:nowrap}
.empty-note{color:var(--dim);font-size:12px;text-align:center;padding:28px 0}

/* ── tailnet ──────────────────────────────────────────────────── */

/* ── logs & alerts ────────────────────────────────────────────── */
#logs{grid-area:logs}
#notif{grid-area:notif}
#bkp{grid-area:bkp}
/* One job per row: its name, then the two facts that decide whether it is
   doing what you think — when it next fires, and how many it keeps. */
.bj{padding:7px 0;border-bottom:1px solid var(--line)}
.bj:last-child{border-bottom:0}
.bj .r1{display:flex;align-items:center;gap:6px}
.bj .nm{font-size:11.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bj .sc{margin-left:auto;font-size:9px;letter-spacing:.06em;text-transform:uppercase;
        color:var(--mut);border:1px solid var(--line);border-radius:4px;padding:0 4px;flex:none}
.bj .r2{font-size:10px;color:var(--mut);margin-top:3px;
        font-family:"DejaVu Sans Mono",ui-monospace,monospace}
.bj .r3{font-size:10px;color:var(--dim);margin-top:2px}
.bj.off{opacity:.5}
.lgh,.lg{display:grid;grid-template-columns:46px 60px 90px minmax(0,1fr);
         gap:8px;align-items:baseline}
.lgh{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);
     padding-bottom:4px;border-bottom:1px solid var(--line);margin-bottom:2px;flex:none}
.lg{padding:4px 0;font-size:10.5px;border-bottom:1px solid var(--line2)}
.lg:last-child{border-bottom:0}
.lg .tm{color:var(--dim);font-family:"DejaVu Sans Mono",ui-monospace,monospace}
.lg .src,.lg .who{color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lg .ms{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--fg)}
.lg.bad .ms{color:var(--bad)} .lg.warn .ms{color:var(--warn)}

.al{display:flex;gap:8px;padding:7px 0;border-bottom:1px solid var(--line2);font-size:11.5px}
.al:last-child{border-bottom:0}
.al .ic{flex:none;width:14px;text-align:center}
.al .tx{flex:1;min-width:0}
.al .tx b{display:block;font-weight:600;font-size:12px;margin-bottom:1px}
.al .tx span{color:var(--mut);font-size:10.5px;display:block}
.ok-note{color:var(--good);font-size:12px;display:flex;gap:8px;align-items:center;padding:10px 0}
.btn{font:inherit;font-size:10.5px;background:#0d141c;border:1px solid var(--line);
     color:var(--fg);border-radius:6px;padding:5px 11px;cursor:pointer;position:relative;
     overflow:hidden;margin:6px 6px 0 0}
.btn:hover{border-color:var(--fg)}
.btn.danger:hover{border-color:var(--bad)}
.btn i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--fg);opacity:.22}
.btn.danger i{background:var(--bad)}
.btn span{position:relative}
/* Offered but not usable from here — see the daemon's action reach rules. */
.btn[disabled]{opacity:.4;cursor:default;border-style:dashed}
.btn[disabled]:hover{border-color:var(--line)}

#stale{position:fixed;inset:0;background:rgba(8,11,17,.94);display:none;
       align-items:center;justify-content:center;color:var(--warn);font-size:19px;z-index:9}

#cores{display:grid;grid-template-columns:repeat(6,1fr);gap:3px;margin-top:7px}
.core{background:#070c12;border:1px solid var(--line2);border-radius:4px;
      position:relative;overflow:hidden;height:29px;
      display:flex;align-items:center;justify-content:center}
/* ── tailnet ──────────────────────────────────────────────────── */
#tnet{grid-area:tnet}
#tnwrap{flex:1;display:grid;grid-template-columns:3fr minmax(0,1fr);gap:12px;min-height:0}
#msvg{width:100%;height:100%;min-height:0}
#tndetail{background:var(--box);border:1px solid var(--line2);border-radius:8px;
          padding:9px 10px;overflow-y:auto;font-size:10.5px;
          scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.dh{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);
    margin-bottom:5px}
.drow{margin-bottom:8px;padding-bottom:7px;border-bottom:1px solid var(--line2)}
.edge{fill:none;stroke-linecap:round}
.e-direct{stroke:var(--good);stroke-width:1.9;opacity:.8}
.e-relay{stroke:var(--warn);stroke-width:1.9;stroke-dasharray:6 5;opacity:.85;
         animation:flow 1.4s linear infinite}
.e-off{stroke:var(--dim);stroke-width:1.1;stroke-dasharray:2 5;opacity:.5}
.ico{fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.hull{fill:var(--fg);fill-opacity:.035;stroke:var(--fg);stroke-opacity:.22;
      stroke-width:1;stroke-dasharray:4 4}
.hull-l{fill:var(--fg);font-size:9px;opacity:.45;letter-spacing:.1em}
.nlbl{fill:var(--fg);font-size:11.5px;font-weight:600}
.nlink{font-size:9.5px}
.ctrs{margin-top:8px;border-top:1px solid var(--line2);padding-top:7px;
      display:flex;flex-wrap:wrap;gap:4px}
.ctrs{margin-top:8px;border-top:1px solid var(--line2);padding-top:7px;
      display:flex;flex-wrap:wrap;gap:4px}
@keyframes flow{to{stroke-dashoffset:-11}}

/* ── the interval picker ──────────────────────────────────────── */
#iv{font:inherit;font-size:11.5px;background:#0b1118;color:var(--fg);
    border:1px solid var(--line);border-radius:99px;padding:5px 9px}

/* ── laptops: four columns is a monitor's layout ──────────────── */
@media (max-width:1400px){
  #app{grid-template-columns:320px minmax(0,1fr) minmax(0,1.2fr);
       grid-template-areas:
         "top top  top"
         "sys vms  tnet"
         "sys logs notif";}
}

/* ── tablets ──────────────────────────────────────────────────── */
@media (max-width:1100px){
  #app{grid-template-columns:minmax(0,1fr) minmax(0,1fr);
       grid-template-rows:auto auto auto auto;
       grid-template-areas:
         "top  top"
         "sys  vms"
         "sys  notif"
         "tnet tnet"
         "logs bkp";}
}

/* ── phones ───────────────────────────────────────────────────── */
/* Same page, same content, one column and a scroll. Ordered by what you came
   to find out: what is wrong, then what is running, then the numbers. On a
   screen opened from a notification, alerts first is the whole point. */
@media (max-width:820px){
  html,body{height:auto}
  body{overflow:auto;overflow-x:hidden;font-size:14px;
       -webkit-text-size-adjust:100%;
       padding-bottom:env(safe-area-inset-bottom)}
  #app{height:auto;min-height:100vh;gap:8px;
       padding:8px max(8px,env(safe-area-inset-right)) 8px max(8px,env(safe-area-inset-left));
       grid-template-columns:minmax(0,1fr);
       grid-template-rows:none;
       grid-template-areas:"top" "notif" "vms" "sys" "tnet" "bkp" "logs";}
  .card{overflow:visible;padding:11px 12px;border-radius:12px}
  .scroll{overflow:visible;max-height:none}

  /* The header stays reachable: it holds the pills that say whether anything
     is reachable at all, and the refresh picker. */
  #top{position:sticky;top:0;z-index:8;
       grid-template-columns:minmax(0,1fr);justify-items:stretch;
       text-align:left;gap:7px;padding:9px 12px;
       padding-top:max(9px,env(safe-area-inset-top));
       background:var(--card);border-radius:0 0 12px 12px;
       box-shadow:0 6px 14px rgba(0,0,0,.35)}
  #brand{font-size:16px;display:flex;align-items:baseline;gap:6px}
  #brand em{margin-left:0}
  #when{justify-self:stretch;display:flex;align-items:baseline;
        justify-content:space-between;text-align:left}
  #clock{font-size:22px}
  #date{font-size:12px}
  /* Pills scroll sideways instead of wrapping into three rows that push the
     content off screen. */
  #pills{justify-self:stretch;justify-content:flex-start;gap:6px;
         flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;
         -webkit-overflow-scrolling:touch;padding-bottom:2px}
  #pills::-webkit-scrollbar{display:none}
  .pill{font-size:11px;padding:5px 10px;flex:none}

  /* Comfortable to hit with a thumb rather than a mouse. 44px is the size a
     finger actually is; anything under it gets mis-tapped. */
  #iv{padding:8px 12px;font-size:13px;min-height:34px}
  .tab{padding:12px 10px;min-height:44px}
  .btn{padding:11px 15px;font-size:12px;margin:7px 7px 0 0;min-height:44px}

  /* Charts are decoration at this width; the numbers above them are not. */
  .chart{height:34px}
  .big{font-size:21px}
  .big .side{float:none;display:block;margin-top:2px}
  .blk{padding:9px 10px;margin-bottom:7px}

  /* label · percent · bar · ceiling collapses to two rows rather than
     squeezing four columns into a phone's width. */
  .vrow{grid-template-columns:32px 46px minmax(0,1fr);gap:7px}
  .vrow .rt{grid-column:1 / -1;text-align:left;color:var(--dim);font-size:10px;
            margin-top:-2px}

  /* Container chips wrap instead of overflowing the card. */
  .ctrs{gap:5px}
  .ctr{font-size:11px;padding:4px 8px}

  /* The map needs real height to be worth drawing, and the node list reads
     better below it than squeezed beside it. */
  #tnwrap{grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto;gap:9px}
  #msvg{height:250px}
  #tndetail{max-height:210px}
  #cores{grid-template-columns:repeat(4,1fr);gap:4px}
  .core{height:32px}

  .lgh,.lg{grid-template-columns:44px 58px minmax(0,1fr)}
  .lgh span:nth-child(3),.lg .who{display:none}
  #logs .scroll,#notif .scroll{max-height:none}
  /* Long names and volume ids must wrap rather than force the page sideways. */
  .g,.bj,.al,.drow{overflow-wrap:anywhere}
}

/* ── narrow phones ───────────────────────────────────────────── */
@media (max-width:380px){
  #cores{grid-template-columns:repeat(3,1fr)}
  .stats{grid-template-columns:minmax(0,1fr)}
  #clock{font-size:20px}
  #msvg{height:220px}
  .vrow{grid-template-columns:30px 42px minmax(0,1fr)}
}

/* Landscape on a phone: the header eats most of a short viewport, so it stops
   sticking and the map gets the height back. */
@media (max-width:900px) and (orientation:landscape) and (max-height:520px){
  #top{position:static}
  #msvg{height:200px}
}
</style>
</head>
<body>

<div id="app">

  <div id="top" class="card">
    <div id="brand">Proxmox VE<em id="nodename"></em></div>
    <div id="pills">
      <div class="pill"><span class="led" id="l_net"></span>internet <b id="v_net">—</b></div>
      <div class="pill"><span class="led" id="l_ctl"></span>headscale <b id="v_ctl">—</b></div>
      <div class="pill">uptime <b id="v_up">—</b></div>
      <div class="pill" id="p_boot" style="display:none"><span class="led warn"></span>reboot pending</div>
      <label class="pill">every
        <select id="iv" aria-label="Refresh interval">
          <option value="1">1s</option><option value="5">5s</option>
          <option value="10" selected>10s</option><option value="30">30s</option>
          <option value="60">60s</option>
        </select>
      </label>
    </div>
    <div id="when">
      <div id="clock" class="mono">--:--:--</div>
      <div id="date">—</div>
    </div>
  </div>

  <div id="sys" class="card">
    <div class="t">system</div>
    <div class="scroll">

      <div class="blk">
        <div class="bh"><span class="l" style="color:var(--cpu)">cpu</span>
          <span class="hw" id="cpu_hw">—</span></div>
        <div class="big mono"><span id="cpu_v">0.0</span><small>%</small>
          <span class="side">load <b id="cpu_load">—</b></span></div>
        <svg class="chart" id="c_cpu" height="48" preserveAspectRatio="none"></svg>
        <div id="cores"></div>
        <div class="stats" id="cpu_stats"></div>
      </div>

      <div class="blk" id="gpu_blk" style="display:none">
        <div class="bh"><span class="l" style="color:var(--gpu)">gpu</span>
          <span class="hw" id="gpu_hw">—</span></div>
        <div class="big mono"><span id="gpu_v">0</span><small>%</small>
          <span class="side">temp <b id="gpu_t">—</b></span></div>
        <svg class="chart" id="c_gpu" height="42" preserveAspectRatio="none"></svg>
        <div class="stats" id="gpu_stats"></div>
      </div>

      <div class="blk">
        <div class="bh"><span class="l" style="color:var(--mem)">memory</span>
          <span class="hw" id="mem_hw">—</span></div>
        <div class="big mono"><span id="mem_used">—</span>
          <small> used of <span id="mem_total">—</span></small>
          <span class="side"><b id="mem_v">0</b>%</span></div>
        <svg class="chart" id="c_mem" height="42" preserveAspectRatio="none"></svg>
        <div class="stats" id="mem_stats"></div>
      </div>

      <div class="blk">
        <div class="bh"><span class="l">network</span><span class="hw" id="net_hw">—</span></div>
        <div class="nrow">
          <div class="hd"><span style="color:var(--dn)">download</span><b id="nd_v">—</b></div>
          <svg class="chart" id="c_down" height="38" preserveAspectRatio="none"></svg>
        </div>
        <div class="nrow">
          <div class="hd"><span style="color:var(--up)">upload</span><b id="nu_v">—</b></div>
          <svg class="chart" id="c_up" height="38" preserveAspectRatio="none"></svg>
        </div>
      </div>

      <div class="blk">
        <div class="bh"><span class="l" style="color:var(--sto)">storage</span></div>
        <div id="fs_rows" style="margin-top:7px"></div>
      </div>

    </div>
  </div>

  <div id="vms" class="card">
    <div class="t">machines</div>
    <div id="tabs"></div>
    <div class="scroll" id="glist"></div>
  </div>

  <div id="tnet" class="card">
    <div class="t">tailnet</div>
    <div id="tnwrap">
      <svg id="msvg" preserveAspectRatio="xMidYMid meet"></svg>
      <div id="tndetail"></div>
    </div>
  </div>

  <div id="logs" class="card">
    <div class="t">logs</div>
    <div class="lgh"><span>time</span><span>type</span><span>who</span><span>what</span></div>
    <div class="scroll" id="loglist"></div>
  </div>

  <div id="bkp" class="card">
    <div class="t">backup jobs</div>
    <div class="scroll" id="bjlist"></div>
  </div>

  <div id="notif" class="card">
    <div class="t">alerts</div>
    <div class="scroll" id="alist"></div>
  </div>

</div>
<div id="stale">data is stale — collector not running?</div>
<script>
"use strict";

// The picker controls how often THIS PAGE asks; the interval travels with the
// request so the server speeds its own sampling up while someone is watching
// and falls back to idle once they stop. Without sending it, choosing 1s would
// just re-fetch the same 60-second-old numbers sixty times.
const $ = (id) => document.getElementById(id);
const LS_KEY = "watch.interval";

let seq = 0, timer = null, lastOk = 0, tab = "all", myBuild = null;
const hist = [];
const gpuHist = [];
const HIST_MAX = 600;

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

const iv = () => parseInt($("iv").value, 10) || 10;

// Per-viewer convenience only, and wrapped: storage throws in a private window
// and the page must render correctly without it.
try {
  const v = localStorage.getItem(LS_KEY);
  if (v && [...$("iv").options].some(o => o.value === v)) $("iv").value = v;
} catch (e) { /* no-op */ }
$("iv").addEventListener("change", () => {
  try { localStorage.setItem(LS_KEY, $("iv").value); } catch (e) { /* no-op */ }
  schedule(true);
});

function bytes(n, digits) {
  if (!n) return "0 B";
  const u = ["B", "KiB", "MiB", "GiB", "TiB"];
  const i = Math.min(u.length - 1, Math.floor(Math.log(n) / Math.log(1024)));
  return (n / Math.pow(1024, i)).toFixed(digits ?? (i ? 1 : 0)) + " " + u[i];
}
const rate = (n) => bytes(n, 1) + "/s";

function dur(s) {
  if (!s) return "—";
  const d = Math.floor(s / 86400), h = Math.floor((s % 86400) / 3600),
        m = Math.floor((s % 3600) / 60);
  return d ? `${d}d ${h}h` : h ? `${h}h ${m}m` : `${m}m`;
}

// Red is reserved for a threshold being hit — nothing is red until something
// is actually wrong. That rule is the whole reason the palette has one colour
// per resource rather than a severity ramp.
const sev = (pct) => pct >= 90 ? "var(--bad)" : pct >= 80 ? "var(--warn)" : null;

// One path, no axes. The question a line answers here is "is it moving", and
// anything more precise belongs on the numbers above it.
function chart(el, values, colour, max) {
  if (!el) return;
  const w = 300, h = el.getAttribute("height") | 0;
  if (values.length < 2) { el.innerHTML = ""; return; }
  const top = max || Math.max(1, ...values);
  const pts = values.map((v, i) => {
    const x = (i / (values.length - 1)) * w;
    const y = h - Math.min(1, v / top) * (h - 3) - 1.5;
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  });
  el.setAttribute("viewBox", `0 0 ${w} ${h}`);
  el.innerHTML =
    `<polygon points="0,${h} ${pts.join(" ")} ${w},${h}" fill="${colour}" opacity=".10"/>` +
    `<polyline points="${pts.join(" ")}" fill="none" stroke="${colour}" ` +
    `stroke-width="1.6" vector-effect="non-scaling-stroke"/>`;
}

function led(el, state) { el.className = "led " + (state || ""); }

function renderTop(s) {
  $("nodename").textContent = s.node || "";
  const r = s.reach || {};
  led($("l_net"), r.internet ? "ok" : "bad");
  $("v_net").textContent = r.internet ? "up" : "down";
  led($("l_ctl"), r.control === null ? "" : r.control ? "ok" : "bad");
  $("v_ctl").textContent = r.control === null ? "—" : r.control ? "up" : "down";
  $("v_up").textContent = dur(s.host.uptime);
  $("p_boot").style.display = s.reboot_pending ? "" : "none";
}

function renderSys(s) {
  const h = s.host;
  $("cpu_hw").textContent =
    [h.cpu_model, h.cores ? h.cores + " threads" : ""].filter(Boolean).join(" · ");
  $("cpu_v").textContent = h.cpu.toFixed(1);
  $("cpu_load").textContent = (h.loadavg || []).join("  ");
  chart($("c_cpu"), hist.map(x => x.cpu), "var(--cpu)", 100);
  $("cpu_stats").innerHTML =
    `<div><span>iowait</span><b>${h.iowait ?? 0}%</b></div>` +
    `<div><span>cores</span><b>${h.cpu_physical ?? "—"}</b></div>`;

  $("mem_hw").textContent = bytes(h.memory.total) + " total";
  $("mem_used").textContent = bytes(h.memory.used);
  $("mem_total").textContent = bytes(h.memory.total);
  $("mem_v").textContent = h.memory.pct;
  chart($("c_mem"), hist.map(x => x.mem), "var(--mem)", 100);
  $("mem_stats").innerHTML =
    `<div><span>swap</span><b>${bytes(h.swap?.used)} / ${bytes(h.swap?.total)}</b></div>` +
    `<div><span>ksm shared</span><b>${bytes(h.ksm)}</b></div>`;

  const n = s.net || {};
  // Said out loud: this series is a minute per point where cpu and memory are
  // whatever you picked. RRD is the only host network source in this API.
  $("net_hw").textContent = n.resolution ? n.resolution + " resolution" : "";
  $("nd_v").textContent = rate(n.in);
  $("nu_v").textContent = rate(n.out);
  const peak = Math.max(1, ...(n.in_series || []), ...(n.out_series || []));
  chart($("c_down"), n.in_series || [], "var(--dn)", peak);
  chart($("c_up"), n.out_series || [], "var(--up)", peak);

  $("fs_rows").innerHTML = (s.storage || []).map(v => {
    const c = sev(v.pct) || "var(--sto)";
    return `<div class="fs">
      <div class="r1"><span>${esc(v.name)}</span>
        <span class="ty">${esc(v.type)}</span>
        <span class="pc" style="color:${sev(v.pct) || ""}">${v.pct}%</span></div>
      <div class="trk"><i style="width:${Math.min(100, v.pct)}%;background:${c}"></i></div>
      <div class="r2"><span>${bytes(v.used)} of ${bytes(v.total)}</span>
        <span class="dev">${bytes(v.total - v.used)} free</span></div>
    </div>`;
  }).join("") || `<div class="empty-note">no storage</div>`;
}

function renderGuests(s) {
  const gs = s.guests || [];
  const on = gs.filter(g => g.running).length;
  const counts = { all: gs.length, running: on, stopped: gs.length - on };
  $("tabs").innerHTML = ["all", "running", "stopped"].map(k =>
    `<button class="tab ${tab === k ? "on" : ""} ${counts[k] ? "" : "empty"}" data-k="${k}">
       ${k}<b>${counts[k]}</b></button>`).join("");
  [...$("tabs").children].forEach(b =>
    b.onclick = () => { tab = b.dataset.k; renderGuests(s); });

  const shown = gs.filter(g =>
    tab === "all" || (tab === "running" ? g.running : !g.running));

  $("glist").innerHTML = shown.map(g => {
    const b = (s.backup_last || {})[String(g.vmid)];
    const scheduled = (s.backup_scheduled || []).includes(g.vmid);
    const age = b ? (Date.now() / 1000 - b.t) / 86400 : null;
    // Not scheduled and never backed up are different facts, and a guest that
    // holds nothing worth keeping should not read as neglected.
    const bv = !scheduled ? `<span style="color:var(--dim)">not scheduled</span>`
      : age === null ? `<span style="color:var(--warn)">never</span>`
      : `${age.toFixed(1)} d ago <span style="color:var(--dim)">(${esc(b.source)})</span>`;
    const mc = sev(g.memory.pct);
    // The dot the kiosk had: state before name, so a stopped guest is visible
    // in the corner of your eye without reading anything.
    const dot = g.running
      ? (mc === "var(--bad)" ? "var(--bad)" : "var(--good)")
      : "var(--dim)";
    const ctrs = g.containers || [];
    return `<div class="g ${g.running ? "" : "off"}">
      <div class="gh"><span class="led" style="background:${dot}"></span>
        <span class="n">${esc(g.name)}</span>
        <span class="tag">${g.vmid}</span>
        <span class="tag">${esc(g.status)}</span>
        <span class="up">${g.running ? "up " + dur(g.uptime) : "—"}</span></div>
      <div class="vrow"><span class="k">cpu</span>
        <span class="pcv">${g.cpu.toFixed(1)}%</span>
        <span class="trk"><i style="width:${Math.min(100, g.cpu)}%;background:var(--cpu)"></i></span>
        <span class="rt">${g.cpus ?? "—"} vcpu</span></div>
      <div class="vrow"><span class="k">mem</span>
        <span class="pcv" style="color:${mc || ""}">${g.memory.pct}%</span>
        <span class="trk"><i style="width:${Math.min(100, g.memory.pct)}%;background:${mc || "var(--mem)"}"></i></span>
        <span class="rt">${bytes(g.memory.used)} of ${bytes(g.memory.total)}</span></div>
      <div class="vrow"><span class="k">net</span>
        <span class="pcv">—</span>
        <span class="trk"></span>
        <span class="rt">↓ ${bytes(g.net?.in)} ↑ ${bytes(g.net?.out)}</span></div>
      ${ctrs.length ? `<div class="ctrs">${ctrs.map(c => {
          // A stopped or unhealthy container is the thing you are looking for,
          // so it gets the colour; a healthy one is just present.
          const col = !c.ok ? "var(--bad)" : c.health === "healthy"
            ? "var(--good)" : "var(--mut)";
          return `<span class="ctr" title="${esc(c.image)} · ${esc(c.status)}">
            <span class="led" style="background:${col}"></span>${esc(c.name)}</span>`;
        }).join("")}</div>` : ""}
      <div class="bk"><span class="k">backup</span><span class="bv">${bv}</span></div>
    </div>`;
  }).join("") || `<div class="empty-note">nothing here</div>`;
}

function renderLogs(s) {
  $("loglist").innerHTML = (s.logs || []).map(l => {
    const cls = l.ok ? "" : "bad";
    const t = l.t ? new Date(l.t * 1000).toTimeString().slice(0, 5) : "—";
    return `<div class="lg ${cls}"><span class="tm">${t}</span>
      <span class="src">${esc(l.type)}</span>
      <span class="who">${esc(l.who)}</span>
      <span class="ms">${esc(l.id ? l.id + " · " : "")}${esc(l.status)}</span></div>`;
  }).join("") || `<div class="empty-note">no recent tasks</div>`;
}

function renderJobs(s) {
  $("bjlist").innerHTML = (s.backup_jobs || []).map(j =>
    `<div class="bj ${j.enabled ? "" : "off"}">
       <div class="r1"><span class="nm">${esc(j.comment || j.id)}</span>
         <span class="sc">${j.enabled ? esc(j.vmid) : "disabled"}</span></div>
       <div class="r2">${esc(j.schedule)} → ${esc(j.storage)}</div>
       <div class="r3">${esc(j.keep)}</div>
     </div>`).join("") || `<div class="empty-note">no backup jobs</div>`;
}

const ICON = { critical: "✖", warn: "▲", info: "•" };

function renderAlerts(d) {
  const a = (d.alerts || []).slice().sort((x, y) =>
    ({ critical: 0, warn: 1, info: 2 }[x.level] ?? 9) -
    ({ critical: 0, warn: 1, info: 2 }[y.level] ?? 9));
  const col = { critical: "var(--bad)", warn: "var(--warn)", info: "var(--cpu)" };
  $("alist").innerHTML = a.length ? a.map(x =>
    `<div class="al"><span class="ic" style="color:${col[x.level]}">${ICON[x.level] || "•"}</span>
       <span class="tx"><b>${esc(x.title)}</b><span>${esc(x.body)}</span></span></div>`).join("")
    : `<div class="ok-note">✔ nothing needs doing</div>`;
}


// ── panels fed by the hypervisor's local exporter ──────────────────
// Each one hides itself when its data is absent. The exporter being down is a
// normal state, not an error state, and an empty card that looks broken is
// worse than no card.

function renderCores(L) {
  const el = $("cores");
  const cores = (L && L.cores) || [];
  el.style.display = cores.length ? "" : "none";
  if (!cores.length) return;
  el.innerHTML = cores.map((v, i) =>
    `<div class="core"><i style="height:${Math.min(100, v)}%;background:var(--cpu)"></i>
       <u>${i}</u><span>${Math.round(v)}</span></div>`).join("");
}

function renderGpu(L) {
  const g = L && L.gpu;
  $("gpu_blk").style.display = g ? "" : "none";
  if (!g) return;
  $("gpu_hw").textContent = [g.name, g.driver].filter(Boolean).join(" · ");
  $("gpu_v").textContent = g.busy;
  $("gpu_t").textContent = g.temp ? g.temp + " °C" : "—";
  gpuHist.push(g.busy);
  if (gpuHist.length > HIST_MAX) gpuHist.shift();
  chart($("c_gpu"), gpuHist, "var(--gpu)", 100);
  $("gpu_stats").innerHTML =
    `<div><span>vram</span><b>${bytes(g.vram_used)} / ${bytes(g.vram_total)}</b></div>` +
    `<div><span>power</span><b>${g.watts ? g.watts + " W" : "—"}</b></div>` +
    `<div><span>core clock</span><b>${g.sclk ? g.sclk + " MHz" : "—"}</b></div>` +
    `<div><span>fan</span><b>${g.fan_rpm ? g.fan_rpm + " rpm" : "—"}</b></div>`;
}

function renderTemps(L) {
  const t = (L && L.cpu_temps) || [];
  if (!t.length) return;
  // Appended to the cpu stats rather than given a row of its own: it is the
  // same resource, and on this part there are exactly two sensors.
  $("cpu_stats").innerHTML += t.map(x =>
    `<div><span>${esc(x.label)}</span><b>${x.c} °C</b></div>`).join("");
}

// ── the tailnet map ────────────────────────────────────────────────
// A radial layout rather than a force simulation: with a dozen nodes physics
// only makes the picture move between refreshes, and a map that will not hold
// still is harder to read than one that is slightly less balanced.
//
// Three things the picture has to carry, because they are the three questions
// actually asked of a tailnet: is a node up, is it reachable DIRECTLY or only
// through a relay, and which machines are guests of this hypervisor. Colour
// answers the first, the edge style the second, and the hull the third.

const ICONS = {
  // 20x20 viewBox, drawn from the centre of the node.
  server:  "M2 4h16v5H2z M2 11h16v5H2z M5 6.5h.01 M5 13.5h.01",
  vm:      "M3 4h14v10H3z M7 17h6 M10 14v3",
  pi:      "M4 5h12v10H4z M7 3v2 M13 3v2 M7 15v2 M13 15v2 M8 8h4v4H8z",
  laptop:  "M4 5h12v8H4z M2 15h16",
  phone:   "M6 2h8v16H6z M9 15.5h2",
  desktop: "M2 4h16v9H2z M7 17h6 M10 13v4",
};

function renderTailnet(L) {
  const tn = (L && L.tailnet) || {};
  const nodes = tn.nodes || [];
  const svg = $("msvg"), detail = $("tndetail");

  if (!nodes.length) {
    svg.innerHTML = "";
    detail.innerHTML = `<div class="dh">tailnet</div><div class="drow">
      <span class="ex">${L && L.ok
        ? "tailscale is not running on the hypervisor"
        : "no data — the hypervisor exporter is unreachable"}</span></div>`;
    return;
  }

  const W = 340, H = 300, cx = W / 2, cy = H / 2;
  const self = nodes.find(n => n.self) || nodes[0];
  const kids = nodes.filter(n => n.parent);          // guests of this host
  const peers = nodes.filter(n => !n.self && !n.parent);

  const pos = new Map([[self.id, [cx, cy]]]);
  const RK = 62, RP = 118;
  // Guests sit on an inner ring inside the hull; everything else on the outer
  // one. Offsetting the two rings' starting angle stops a guest and a peer
  // lining up and overlapping their labels.
  kids.forEach((n, i) => {
    const a = (i / Math.max(1, kids.length)) * Math.PI * 2 - Math.PI / 2;
    pos.set(n.id, [cx + Math.cos(a) * RK, cy + Math.sin(a) * RK]);
  });
  peers.forEach((n, i) => {
    const a = (i / Math.max(1, peers.length)) * Math.PI * 2 - Math.PI / 2 + 0.38;
    pos.set(n.id, [cx + Math.cos(a) * RP, cy + Math.sin(a) * RP]);
  });

  const colOf = (n) => n.self ? "var(--fg)"
    : !n.online ? "var(--dim)"
    : n.link === "relay" ? "var(--warn)" : "var(--good)";

  const edges = nodes.filter(n => !n.self).map(n => {
    const [x, y] = pos.get(n.id);
    const cls = n.link === "direct" ? "e-direct"
      : n.link === "relay" ? "e-relay" : "e-off";
    // Curved toward the centre so edges to opposite sides do not overlap into
    // one straight line through the middle.
    const mx = (cx + x) / 2, my = (cy + y) / 2;
    return `<path class="edge ${cls}" d="M${cx},${cy} Q${mx},${my} ${x},${y}"/>`;
  }).join("");

  const glyphs = nodes.map(n => {
    const [x, y] = pos.get(n.id);
    const col = colOf(n);
    const d = ICONS[n.kind] || ICONS.desktop;
    const r = n.self ? 17 : 13;
    return `<g>
      <circle cx="${x}" cy="${y}" r="${r}" fill="var(--box)" stroke="${col}"
        stroke-width="${n.self ? 1.8 : 1.2}" opacity="${n.online ? 1 : .55}"/>
      <g transform="translate(${x - 10},${y - 10}) scale(1)" opacity="${n.online ? 1 : .5}">
        <path class="ico" d="${d}" stroke="${col}"/></g>
      <text class="nlbl" x="${x}" y="${y + r + 12}" text-anchor="middle"
        fill="${n.online ? "var(--fg)" : "var(--dim)"}">${esc(n.name)}</text>
    </g>`;
  }).join("");

  // The hull is drawn only when this host actually has guests on the tailnet —
  // an empty circle round nothing reads as a missing feature.
  const hull = kids.length
    ? `<circle cx="${cx}" cy="${cy}" r="${RK + 22}" class="hull"/>
       <text class="hull-l" x="${cx}" y="${cy - RK - 27}" text-anchor="middle">${esc(self.name)}</text>`
    : "";

  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  svg.innerHTML = hull + edges + glyphs;

  const order = { self: 0, direct: 1, relay: 2, offline: 3 };
  const online = nodes.filter(n => n.online).length;
  detail.innerHTML =
    `<div class="dh">${online}/${nodes.length} online` +
    (tn.relays && tn.relays.length ? ` · via ${esc(tn.relays.join(", "))}` : "") +
    `</div>` +
    nodes.slice().sort((a, b) => (order[a.link] ?? 9) - (order[b.link] ?? 9))
      .map(n => `<div class="drow">
        <div class="nm"><span style="color:${colOf(n)}">●</span> ${esc(n.name)}
          <span class="ex" style="margin-left:auto">${esc(n.kind)}</span></div>
        <div class="dns">${esc(n.ip)}</div>
        <div class="ex">${esc(n.link)}${n.relay && n.link === "relay"
          ? " · " + esc(n.relay) : ""}${n.addr ? " · " + esc(n.addr) : ""}</div>
      </div>`).join("");
}

function clock() {
  const d = new Date();
  $("clock").textContent = d.toTimeString().slice(0, 8);
  $("date").innerHTML = d.toLocaleDateString(undefined,
    { weekday: "short", day: "numeric", month: "short" });
}

function render(d) {
  const s = d.latest;
  if (!s || !s.host) return;
  renderTop(s); renderSys(s); renderGuests(s);
  const L = s.local || {};
  renderCores(L); renderGpu(L); renderTemps(L); renderTailnet(L);
  renderLogs(s); renderJobs(s); renderAlerts(d);
  $("stale").style.display =
    (Date.now() / 1000 - (s.generated || 0)) > 300 ? "flex" : "none";
}

async function poll() {
  try {
    const r = await fetch(`/api/state?since=${seq}&interval=${iv()}`, { cache: "no-store" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    const d = await r.json();
    seq = d.seq || seq;
    for (const h of (d.history || [])) {
      hist.push(h);
      if (hist.length > HIST_MAX) hist.shift();
    }
    // The screen is unattended and cog never re-fetches on its own, so a deploy
    // would otherwise leave old JavaScript running against a new payload
    // forever. The server hashes the page it is serving; if that stops matching
    // the one this tab loaded, the code on screen is stale — reload it.
    const build = d.meta && d.meta.build;
    if (build) {
      if (!myBuild) myBuild = build;
      else if (build !== myBuild) { location.reload(); return; }
    }
    render(d);
    lastOk = Date.now();
  } catch (e) {
    // A failed poll is not a reason to blank the page — the last known state is
    // still the most useful thing on it. The overlay is the signal, and only
    // after long enough that this is not one dropped request.
    if (Date.now() - lastOk > 60000) $("stale").style.display = "flex";
  }
}

function schedule(now) {
  if (timer) clearInterval(timer);
  if (now) poll();
  timer = setInterval(poll, iv() * 1000);
}

// Stop polling when the tab is hidden. On a phone this is what stops a page you
// opened from a notification and then pocketed from holding the server at its
// fastest sampling rate all afternoon.
document.addEventListener("visibilitychange", () => {
  if (document.hidden) { clearInterval(timer); timer = null; }
  else schedule(true);
});

clock(); setInterval(clock, 1000);
schedule(true);
</script>
</body>
</html>
