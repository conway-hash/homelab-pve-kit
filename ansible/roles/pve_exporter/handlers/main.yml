---
# Named distinctly from every other role's handlers: handler names are
# play-global, so anything generic would collide silently.

- name: Reload systemd for the exporter
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Restart the exporter
  ansible.builtin.systemd_service:
    name: pve-exporter
    state: restarted
