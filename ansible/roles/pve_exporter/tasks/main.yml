---
# The handful of facts only the hypervisor can see — per-core CPU, temperatures,
# GPU, the tailnet, and what each guest's memory is REALLY doing.
#
# This is application code back on the hypervisor, which the move to a guest was
# meant to end, so it earns its place explicitly: every one of those five comes
# from /proc, /sys, `tailscale` or `qm guest exec`, and none of them is in the
# Proxmox API at any privilege level. See the docstring in files/exporterd.py.
#
# It reads and never writes. No POST routes, no actions, no token — the
# dashboard does reboots through the Proxmox API with a token scoped for it,
# and this service stays boring.

- name: Install what the exporter reads from
  # pciutils for lspci, which is how the GPU gets a name rather than a PCI ID.
  # Both are usually already present on a Proxmox host; this makes it true
  # rather than assumed.
  ansible.builtin.apt:
    name:
      - pciutils
      - python3
    state: present
    install_recommends: false

- name: Create the exporter directory
  ansible.builtin.file:
    path: "{{ exporter_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Read the hypervisor's tailnet address
  # The bind address. The tailscale role runs before this one in site.yml, so
  # the interface is already up and holding its address.
  ansible.builtin.command: tailscale ip -4
  register: pve_exporter_tailnet_ip
  changed_when: false
  check_mode: false

- name: Refuse to deploy without a tailnet address
  # Without this the template renders an empty bind address. Python's
  # ThreadingHTTPServer reads "" as INADDR_ANY — every interface, including the
  # LAN bridge every device in the house sits on. Failing is the safe direction.
  ansible.builtin.assert:
    that: pve_exporter_tailnet_ip.stdout | trim | length > 0
    fail_msg: >-
      `tailscale ip -4` returned nothing, so this host has no tailnet address to
      bind to. Deploying now would publish the exporter on every interface,
      including the LAN. Fix the tailnet join first.

- name: Install the exporter
  ansible.builtin.copy:
    src: exporterd.py
    dest: "{{ exporter_dir }}/exporterd.py"
    owner: root
    group: root
    mode: "0755"
  notify: Restart the exporter

- name: Write the exporter environment
  ansible.builtin.template:
    src: exporter.env.j2
    dest: "{{ exporter_dir }}/exporter.env"
    owner: root
    group: root
    mode: "0644"
  notify: Restart the exporter

- name: Install the exporter unit
  ansible.builtin.template:
    src: pve-exporter.service.j2
    dest: /etc/systemd/system/pve-exporter.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd for the exporter

- name: Enable and start the exporter
  ansible.builtin.systemd_service:
    name: pve-exporter
    enabled: true
    state: started
    daemon_reload: true

- name: Flush handlers before verifying
  ansible.builtin.meta: flush_handlers

- name: Wait for the exporter to answer  # noqa: command-instead-of-module
  # curl rather than the uri module, for the reason documented at length in
  # svc_vaultwarden: uri resolves through this host's resolver and has failed
  # in CI against a healthy service. This asks the only question it is here to
  # answer, with no DNS in the path.
  ansible.builtin.command: >-
    curl -fsS --max-time 10
    http://{{ pve_exporter_tailnet_ip.stdout | trim }}:{{ exporter_port }}/metrics
  register: pve_exporter_alive
  until: pve_exporter_alive is success
  retries: 12
  delay: 5
  changed_when: false

- name: Report what the exporter can and cannot see
  # Not a failure. A host with no discrete GPU, or with k10temp absent, is a
  # perfectly good host — the panels for those simply have nothing to draw. But
  # silently shipping an empty GPU card looks like a bug in the dashboard, so
  # say which it is here, once, at deploy time.
  ansible.builtin.debug:
    msg: >-
      exporter: cores={{ _m.cores | default([]) | length }}
      temps={{ _m.cpu_temps | default([]) | length }}
      gpu={{ 'yes' if _m.gpu else 'none detected' }}
      tailnet={{ _m.tailnet.nodes | default([]) | length }} nodes
      guest_memory={{ _m.guest_memory | default({}) | length }} guests
  vars:
    _m: "{{ pve_exporter_alive.stdout | from_json }}"
