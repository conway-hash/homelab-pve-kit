---
- name: Confirm this is actually a Proxmox host
  # Cheap guard against a fat-fingered --limit pointing this role at a
  # plain Debian box, where the pvesh task below would fail confusingly
  # halfway through instead of up front.
  ansible.builtin.stat:
    path: /usr/bin/pvesh
  register: pve_host_pvesh_bin
  failed_when: not pve_host_pvesh_bin.stat.exists

- name: Install sudo
  # Proxmox's ISO install does not ship sudo, so the ci-deploy account's
  # /etc/sudoers.d entry is inert until something installs it — found the
  # hard way on the live box.
  #
  # This task CANNOT bootstrap that: `become: true` needs sudo to already
  # exist in order to run this at all. SETUP.md step 1 installs it by
  # hand, and this task only keeps it installed afterwards. Removing sudo
  # from the host locks this playbook out until you fix it manually.
  ansible.builtin.apt:
    name: sudo
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Install unattended-upgrades
  ansible.builtin.apt:
    name: unattended-upgrades
    state: present

- name: Enable periodic package-list refresh and unattended upgrades
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      // Managed by Ansible (pve_host) — edits will be overwritten
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
    owner: root
    group: root
    mode: "0644"

- name: Add extra unattended-upgrade origins
  ansible.builtin.template:
    src: 52-homelab-unattended-upgrades.j2
    dest: /etc/apt/apt.conf.d/52-homelab-unattended-upgrades
    owner: root
    group: root
    mode: "0644"
    # A malformed apt.conf breaks EVERY apt invocation on the box,
    # including the ones that would fix it. Parse it before it lands.
    validate: apt-config -c %s dump

# ── Update notifications ─────────────────────────────────────────────
# No endpoint or matcher is configured here on purpose. Proxmox ships a
# built-in mail-to-root target that delivers via local sendmail to root's
# mailbox on this box — no credentials, no external service. The only
# thing missing is the policy flag below.
#
# Proxmox has no in-UI notification inbox; the closest thing is the
# Node -> Updates panel, which lists pending packages with no config at
# all. Real push delivery (ntfy/Gotify webhook endpoint + matcher) gets
# added here once a notification service exists to point at.

- name: Read the current cluster notification policy
  ansible.builtin.command: pvesh get /cluster/options --output-format json
  register: pve_host_cluster_options
  changed_when: false
  # command tasks are skipped under --check by default, which would leave
  # the task below with no stdout to parse. This one only reads, so it is
  # safe — and necessary — to run during a dry run too.
  check_mode: false

- name: Set the package-updates notification policy
  ansible.builtin.command: >-
    pvesh set /cluster/options
    --notify package-updates={{ pve_notify_package_updates }}
  vars:
    # pvesh returns `notify` as an OBJECT — {"package-updates": "always"} —
    # not the "key=value" string the CLI takes as input. Substring-testing
    # it against "package-updates=always" never matches, so the task reruns
    # on every single play. Compare the parsed field instead.
    #
    # The key is absent entirely on a host that has never had this set,
    # hence .get with a default rather than a subscript.
    _notify: "{{ (pve_host_cluster_options.stdout | from_json).notify | default({}) }}"
  when: _notify.get('package-updates', '') != pve_notify_package_updates
  changed_when: true

# ── Backups ──────────────────────────────────────────────────────────
#
# A vault with no backup is a single disk away from every password being gone,
# and unlike most services there is no re-deriving the contents. Snapshot mode
# rather than stop mode so the guest stays up; Vaultwarden's SQLite database is
# in WAL mode and survives it, and the alternative is a nightly outage.
#
# This lives here rather than in svc_vaultwarden because vzdump is a hypervisor
# facility — the guest has no say in whether it is backed up, and shouldn't.

# Which guests should HAVE a backup job: switched on, and carrying a `backup:`
# policy. Both halves matter.
#
# The service filter is not decoration. Without it this role writes a nightly
# vzdump job for every guest in the list including the switched-off ones —
# whose VMs pve_guests has either destroyed or never created — and Proxmox
# happily accepts a job for a vmid that does not exist, then fails it every
# night at the appointed hour. That is exactly what happened the moment a
# second service was added to the repo while still switched off.
#
# Computed here rather than reused from pve_guests, which looks like
# duplication and is not: site.yml runs pve_host BEFORE pve_guests, so that
# role's facts do not exist yet.
- name: Work out which guests should have a backup job
  ansible.builtin.set_fact:
    pve_host_backup_wanted: >-
      {{ pve_guests
         | selectattr('service', 'in', _enabled)
         | selectattr('backup', 'defined') | list }}
  vars:
    _enabled: >-
      {{ service_enabled | dict2items | selectattr('value')
         | map(attribute='key') | list }}

- name: Read the current backup jobs
  ansible.builtin.command: pvesh get /cluster/backup --output-format json
  register: pve_host_backup_jobs
  changed_when: false
  # Read-only, so it is safe — and necessary — under --check too. Otherwise
  # the task below has no stdout to compare against and a dry run reports a
  # change it would not actually make.
  check_mode: false

- name: Create the backup jobs
  ansible.builtin.command:
    argv:
      - pvesh
      - create
      - /cluster/backup
      - --comment=homelab-pve-kit {{ item.name }}
      - --vmid={{ item.vmid }}
      - --storage={{ pve_backup_storage }}
      - --schedule={{ item.backup.schedule }}
      - --mode={{ pve_backup_mode }}
      - --compress={{ pve_backup_compress }}
      - --prune-backups=keep-last={{ item.backup.keep_last }}
      - --enabled=1
      - --notification-mode=notification-system
  # Derived from the guest list rather than a parallel list of its own, so a
  # vmid is written exactly once. A guest with no `backup:` key gets no job.
  loop: "{{ pve_host_backup_wanted }}"
  loop_control:
    label: "{{ item.name }} (vmid {{ item.vmid }})"
  # pvesh has no upsert: creating the same job twice produces two jobs that
  # both run. Matched on the comment because that is the only field this repo
  # controls that Proxmox keeps verbatim — the job ID is generated.
  # `default('')` matters: a job created by hand in the web UI may have no
  # comment field at all, and map() over a missing attribute raises rather than
  # skipping — which would break this task on exactly the hosts that have the
  # most existing configuration to preserve.
  when: "'homelab-pve-kit ' + item.name not in (pve_host_backup_jobs.stdout | from_json | map(attribute='comment', default='') | list)"
  changed_when: true

# ⚠️ The task above is create-only, and skips entirely once a job with the
# matching comment exists. On its own that means every var it reads —
# storage, schedule, compression, retention — is applied ONCE, at creation,
# and silently ignored forever after: you could edit this repo, watch the play
# report `ok`, and have changed nothing on the host.
#
# That is not hypothetical. It is how the vault ended up still writing
# uncompressed archives to `local` long after this repo said otherwise. A
# create-only task in a converging playbook is a bug, so this is the other
# half of it.
- name: Converge the existing backup jobs
  ansible.builtin.command:
    argv:
      - pvesh
      - set
      - /cluster/backup/{{ _job.id }}
      - --storage={{ pve_backup_storage }}
      - --schedule={{ item.backup.schedule }}
      - --mode={{ pve_backup_mode }}
      - --compress={{ pve_backup_compress }}
      - --prune-backups=keep-last={{ item.backup.keep_last }}
      - --enabled=1
  loop: "{{ pve_host_backup_wanted }}"
  loop_control:
    label: "{{ item.name }} (vmid {{ item.vmid }})"
  vars:
    # selectattr('comment', 'defined') first: a hand-made job may carry no
    # comment key at all, and selectattr on a missing attribute raises rather
    # than skipping.
    _job: >-
      {{ (pve_host_backup_jobs.stdout | from_json
          | selectattr('comment', 'defined')
          | selectattr('comment', 'equalto', 'homelab-pve-kit ' + item.name)
          | list | first | default({})) }}
  # Only when something actually differs, so a converged host reports `ok`
  # rather than changing every run. Proxmox returns these as strings, and omits
  # `compress` entirely when it was never set — hence the defaults.
  when:
    - _job.id is defined
    - >-
      _job.storage | default('') != pve_backup_storage
      or _job.schedule | default('') != item.backup.schedule
      or _job.mode | default('') != pve_backup_mode
      or _job.compress | default('') != pve_backup_compress
      or (_job['prune-backups'] | default({}))
         != {'keep-last': item.backup.keep_last | string}
  changed_when: true

# The counterpart to the two tasks above. Switching a service off destroys its
# guest (pve_guests does that), so leaving its backup job behind means a
# nightly vzdump against a vmid that no longer exists, failing forever and
# training you to ignore backup failure notifications — which is worse than
# having none.
#
# Scoped to jobs this repo created, matched on the comment prefix. A job made
# by hand in the web UI is never touched.
- name: Remove backup jobs for guests that are switched off
  ansible.builtin.command:
    argv:
      - pvesh
      - delete
      - /cluster/backup/{{ item.id }}
  loop: >-
    {{ pve_host_backup_jobs.stdout | from_json
       | selectattr('comment', 'defined')
       | selectattr('comment', 'match', '^homelab-pve-kit ')
       | rejectattr('comment', 'in', _wanted_comments) | list }}
  loop_control:
    label: "{{ item.comment }} (job {{ item.id }})"
  vars:
    _wanted_comments: >-
      {{ pve_host_backup_wanted
         | map(attribute='name')
         | map('regex_replace', '^', 'homelab-pve-kit ') | list }}
  changed_when: true
