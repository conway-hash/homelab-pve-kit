---
- name: Load the watchdog module now
  # modules-load.d only takes effect at boot, and the point of this role is
  # that the machine is protected from the moment it converges — not from
  # whenever it next happens to reboot.
  #
  # `command`, not community.general.modprobe: pulling in a whole collection
  # for one call is the kind of dependency this repo's requirements.yml
  # explicitly refuses to carry.
  ansible.builtin.command: modprobe i6300esb
  changed_when: true
  # Not fatal. Where the device is built in or already autoloaded, modprobe
  # returning non-zero does not mean the watchdog is unavailable — the systemd
  # unit is the real check.
  failed_when: false

# Debian ships watchdog.service and wd_keepalive.service with Conflicts= on
# each other: wd_keepalive exists to keep petting /dev/watchdog while watchdog
# itself is being restarted. A plain `state: restarted` queues both, systemd
# resolves the conflict by cancelling one of them, and the result is
# "Job for watchdog.service canceled." — which reads like a service failure
# rather than a scheduling conflict.
#
# Stopping the keepalive first makes the transaction unambiguous. The hardware
# timeout is guest_watchdog_timeout seconds and the gap here is under a second,
# so nothing gets close to tripping a reset.
- name: Stop wd_keepalive so the watchdog restart is not cancelled
  listen: Restart watchdog
  ansible.builtin.systemd_service:
    name: wd_keepalive
    state: stopped
  # Absent on some installs, and not an error when it is.
  failed_when: false

- name: Restart the watchdog daemon
  listen: Restart watchdog
  ansible.builtin.systemd_service:
    name: watchdog
    state: restarted
