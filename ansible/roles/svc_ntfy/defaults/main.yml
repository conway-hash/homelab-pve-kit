---
# This file holds ONLY vars with no safe default — secrets and
# required-but-unset values, declared as "" with an ansible.builtin.assert in
# tasks/main.yml that refuses to deploy without them. Everything with a real
# default (versions, paths, the domain) lives in group_vars/ntfy_host/vars.yml,
# not here; the same key in both files is the duplication bug this repo has
# already paid down once.
#
# Set for real in group_vars/ntfy_host/secrets.yml (git-ignored) or written by
# CI from the `ntfy` GitHub Environment immediately before the playbook runs.
# See docs/ntfy.md.

# Password for the `publisher` account — the one every SERVICE authenticates as
# to POST a notification. Write access, no read: a compromised publisher can
# make your phone buzz, but cannot read back what anything else has sent.
#
# Shared by every service that notifies, which is the point of running one ntfy
# rather than one per service. A new service needs no change here and no change
# on the ntfy guest at all — it publishes to a new topic with this same
# account, because `publisher` is granted write on `*`.
svc_ntfy_publisher_password: ""

# Password for the `phone` account — read-only, and what the ntfy Android app
# logs in as. Separate from the publisher on purpose: the device you carry
# around should not hold a credential that can forge alerts.
svc_ntfy_phone_password: ""

# Cloudflare API token used for the ACME DNS-01 challenge, so Let's Encrypt can
# prove control of the domain without anything being publicly reachable.
#
# Its OWN token, not a copy of the vault's. Same zone and same permissions, but
# revoking one must not take the other down, and Cloudflare's audit log should
# say which machine did what. Mint it from the "Edit zone DNS" template,
# restricted to the single zone — that is Zone:Read + DNS:Edit, and both halves
# are needed because the plugin walks up from _acme-challenge.<host> to find the
# owning zone, which DNS:Edit alone cannot do.
svc_ntfy_cloudflare_api_token: ""
