---
# Firefly III behind its own Caddy, with its own Postgres, all as containers
# on this guest.

- name: Refuse to deploy without an app key of exactly 32 characters
  # Length, not merely presence. Firefly's own .env.example requires exactly
  # 32, and a key of the wrong length does not fail at startup — it fails
  # later, when something is decrypted, which is a much worse place to find out.
  ansible.builtin.assert:
    that: svc_firefly_app_key | length == 32
    fail_msg: >-
      svc_firefly_app_key must be EXACTLY 32 characters (it is
      {{ svc_firefly_app_key | length }}). Generate one with
      `openssl rand -base64 24` and put it in
      group_vars/finance_host/secrets.yml — see docs/finance.md.

- name: Refuse to deploy without a cron token of exactly 32 characters
  ansible.builtin.assert:
    that: svc_firefly_cron_token | length == 32
    fail_msg: >-
      svc_firefly_cron_token must be EXACTLY 32 characters (it is
      {{ svc_firefly_cron_token | length }}). Firefly refuses to run its
      scheduled jobs at any other length, and it refuses quietly — recurring
      transactions simply never appear. `openssl rand -hex 16` — see
      docs/finance.md.

- name: Refuse to deploy without a database password
  ansible.builtin.assert:
    that: svc_firefly_postgres_password | length > 0
    fail_msg: >-
      svc_firefly_postgres_password is unset. The postgres image refuses to
      initialise without one, so the stack would come up with Firefly
      crash-looping against a database that never started — see docs/finance.md.

- name: Refuse to deploy without the Cloudflare API token
  ansible.builtin.assert:
    that: svc_firefly_cloudflare_api_token | length > 0
    fail_msg: >-
      svc_firefly_cloudflare_api_token is unset, so Caddy cannot answer the
      ACME DNS-01 challenge and will never obtain a certificate. Mint a
      SEPARATE token from the other services' — see docs/finance.md.

- name: Refuse to deploy a half-configured importer
  # All three or none. Two out of three gets you a stack that comes up, looks
  # healthy, and fails only at the moment you try to connect a bank — which is
  # the least convenient moment to discover a missing credential.
  ansible.builtin.assert:
    that: >-
      (svc_firefly_access_token | length > 0)
      == (svc_firefly_eb_app_id | length > 0)
      and (svc_firefly_eb_app_id | length > 0)
      == (svc_firefly_eb_private_key | length > 0)
    fail_msg: >-
      The Data Importer needs svc_firefly_access_token, svc_firefly_eb_app_id
      and svc_firefly_eb_private_key together, and exactly
      {{ [svc_firefly_access_token, svc_firefly_eb_app_id,
          svc_firefly_eb_private_key] | select('!=', '') | list | length }}
      of the three are set. See docs/finance.md.

# ── What the stack is allowed to listen on ───────────────────────────

- name: Read the guest's tailnet address
  # The tailscale role runs before this one in site.yml, so the interface is
  # already up and holding its address by the time this asks.
  ansible.builtin.command: tailscale ip -4
  register: svc_firefly_tailnet_ip
  changed_when: false
  check_mode: false

- name: Refuse to deploy without a tailnet address
  # Without this the template renders an empty bind address, which Docker
  # reads as "all interfaces" — silently publishing every transaction you own
  # to the whole LAN. Failing is the safe direction.
  ansible.builtin.assert:
    that: svc_firefly_tailnet_ip.stdout | trim | length > 0
    fail_msg: >-
      `tailscale ip -4` returned nothing, so this guest is not on the tailnet.
      Fix the tailnet join first — see docs/finance.md.

- name: Create the stack directory
  ansible.builtin.file:
    path: "{{ firefly_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Create the Caddy state directories
  # Only Caddy's, and only these. Firefly's uploads and the Postgres cluster
  # are NAMED docker volumes rather than bind mounts — see compose.yml.j2 for
  # why. Caddy runs as root, so re-asserting root:root here is safe in a way
  # it was not for the links guest's Postgres.
  ansible.builtin.file:
    path: "{{ firefly_dir }}/{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0750"
  loop:
    - caddy-data      # issued certificates and the ACME account key
    - caddy-config    # Caddy's own autosaved config

- name: Write the Caddy build file
  ansible.builtin.template:
    src: Dockerfile.caddy.j2
    dest: "{{ firefly_dir }}/Dockerfile.caddy"
    owner: root
    group: root
    mode: "0640"
  notify: Restart the firefly stack

- name: Write the Caddyfile
  ansible.builtin.template:
    src: Caddyfile.j2
    dest: "{{ firefly_dir }}/Caddyfile"
    owner: root
    group: root
    mode: "0640"
  notify: Restart the firefly stack

- name: Write the compose file
  ansible.builtin.template:
    src: compose.yml.j2
    dest: "{{ firefly_dir }}/compose.yml"
    owner: root
    group: root
    mode: "0640"
  notify: Restart the firefly stack

- name: Write the environment files
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "{{ firefly_dir }}/{{ item }}"
    owner: root
    group: root
    mode: "0600"
  loop:
    - firefly.env
    - postgres.env
    - caddy.env
    - importer.env
  no_log: true
  notify: Restart the firefly stack

- name: Install the stack unit
  ansible.builtin.template:
    src: firefly.service.j2
    dest: /etc/systemd/system/firefly.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: Enable and start the stack
  ansible.builtin.systemd_service:
    name: firefly
    enabled: true
    state: started
    daemon_reload: true

- name: Install the self-heal script
  ansible.builtin.template:
    src: healthcheck.sh.j2
    dest: "{{ firefly_dir }}/healthcheck.sh"
    owner: root
    group: root
    mode: "0750"

- name: Install the scheduled-jobs script
  # 0700, not 0750: unlike healthcheck.sh this one contains the cron token.
  ansible.builtin.template:
    src: cron.sh.j2
    dest: "{{ firefly_dir }}/cron.sh"
    owner: root
    group: root
    mode: "0700"
  no_log: true

- name: Install the timers and their units
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - firefly-healthcheck.service
    - firefly-healthcheck.timer
    - firefly-cron.service
    - firefly-cron.timer
  notify: Reload systemd

- name: Flush handlers before verifying
  # The check below asserts on the running stack. Without this it would run
  # against whatever was up BEFORE this play's changes were applied.
  ansible.builtin.meta: flush_handlers

- name: Enable and start the timers
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
    daemon_reload: true
  loop:
    - firefly-healthcheck.timer
    - firefly-cron.timer

# noqa is the FIRST in this repo, so it earns an explanation: the rule exists
# to stop people shelling out to curl where the uri module would do, and here
# the uri module provably would not. It resolves through the guest's resolver
# and failed sixty times in CI against a healthy stack, in the same play where
# a getent for the same name succeeded. curl --resolve is the only way to ask
# "is this serving" without also asking "has DNS converged".
- name: Wait for Firefly III to answer over HTTPS  # noqa: command-instead-of-module
  # curl through the loopback publish, NOT the uri module against the public
  # name, and the distinction is load-bearing.
  #
  # uri resolves through the guest's own resolver. In CI that failed sixty
  # times over ten minutes with "No address associated with hostname" against
  # a stack that was up, healthy and holding a valid certificate — while a
  # `getent hosts` for the same name, run seconds earlier in the same play,
  # succeeded. Whatever the runner does to the tailnet mid-deploy, this check
  # should not be the thing that discovers it.
  #
  # So it asks the only question it is actually here to answer — is the stack
  # serving — by the same route healthcheck.sh uses, with no DNS in the path.
  # --resolve still pins SNI, so the certificate is genuinely verified rather
  # than skipped. The real client path (MagicDNS, over the tailnet, from
  # off-box) is what the deploy's smoke test checks, which is the right place
  # for it: that test failing means something a user would notice, where this
  # one failing only ever meant Ansible could not look up a name.
  ansible.builtin.command: >-
    curl -fsS --max-time 15
    --resolve {{ firefly_domain }}:443:127.0.0.1
    https://{{ firefly_domain }}/
  register: svc_firefly_alive
  until: svc_firefly_alive is success
  retries: 60
  delay: 10
  changed_when: false
