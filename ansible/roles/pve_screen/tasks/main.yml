---
# The monitor physically wired to the hypervisor, showing the watch dashboard.
#
# This is the surviving third of pve_kiosk. That role sampled the box, served a
# web page and drove the screen; the first two are the watch guest's job now,
# and driving a screen turns out to be one package list and one line in a login
# profile.
#
# Points at 127.0.0.1, so the display works whenever the host does — no tailnet
# and no guest in the path. It briefly pointed across the tailnet at a guest
# instead, which meant a wedged guest left the monitor showing an error page.
# Local is the right dependency for a screen whose job is showing you that
# something else is broken.

- name: Install the screen stack
  # cage is a single-purpose Wayland compositor: it runs exactly one fullscreen
  # client, with no desktop, panel, or launcher.
  #
  # cog, not chromium. Debian's chromium pulls a desktop's worth of
  # dependencies onto what is meant to be a hypervisor — 174 packages with
  # recommends, and even with them off it still drags cups-common,
  # system-config-printer and upower. cog is WebKit built for exactly this job
  # and adds no daemons at all.
  #
  # install_recommends: false matters here; chromium's numbers above were what
  # made this worth measuring rather than assuming.
  ansible.builtin.apt:
    name:
      - cage
      - cog
      - fonts-dejavu-core
    state: present
    install_recommends: false

- name: Point tty1 at the watch dashboard
  # tty1 already autologins root and runs btop from .bash_profile; this
  # replaces what that line launches, keeping the same mechanism.
  #
  # Deliberately NOT `exec cage`: if cage or cog fails to start, the shell
  # falls through to btop and the monitor still shows something useful instead
  # of a bare prompt or a black screen.
  #
  # --enable-dev-tools is not set: there is a keyboard on this box, and a
  # devtools window would replace the dashboard in cage's single slot.
  ansible.builtin.blockinfile:
    path: /root/.bash_profile
    create: true
    owner: root
    group: root
    mode: "0644"
    # A different marker from pve_kiosk's, so this block is added rather than
    # silently editing that one — and so the removal task below can tell them
    # apart.
    marker: "# {mark} ANSIBLE MANAGED — pve_screen"
    block: |
      if [ "$(tty)" = "/dev/tty1" ]; then
          cage -- cog "http://127.0.0.1:{{ kiosk_port }}/" || btop
      fi
  notify: Restart the screen session

# ── Make the RUNNING session match the file ──────────────────────────
#
# A handler only fires when the task above reports a change, which leaves a gap
# this role fell straight into: the profile was rewritten to the new URL, the
# handler restarted the session, and the next run found the file already correct
# — so nothing fired, and a session still showing the OLD url kept showing it.
# Converged config, unconverged reality, and no output saying so.
#
# So this reads what is actually on the glass and reconciles it, the same way
# pve_guests reads the running config before deciding what changed.

- name: Read what the screen is currently showing
  ansible.builtin.command: pgrep -a -x cage
  register: pve_screen_running
  changed_when: false
  check_mode: false
  # pgrep exits 1 when nothing matches, which is the normal state on a box
  # whose screen has never been started.
  failed_when: false

- name: Restart the screen session if it is showing the wrong thing
  # Covers both "pointing at the old URL" and "not running at all". Restarting
  # the getty ends the login session; agetty respawns it, autologin re-runs
  # .bash_profile, and cage comes up against the URL that is actually in the
  # file now.
  #
  # ⚠️ This ends whatever is on tty1, including a shell someone is typing into
  # at the console. For a screen whose entire job is displaying one page that is
  # the right trade, but it is worth knowing before running this while standing
  # in front of the machine.
  ansible.builtin.systemd_service:
    name: getty@tty1.service
    state: restarted
  when: ('127.0.0.1:' ~ kiosk_port) not in (pve_screen_running.stdout | default(''))
  changed_when: true
