---
# Named distinctly from every other role's handlers: handler names are
# play-global, so anything generic would collide silently.

- name: Restart the screen session
  # tty1 runs the browser from root's .bash_profile, so there is no unit to
  # restart — killing cage drops the login shell back to the profile, which
  # launches it again with whatever URL was just written.
  ansible.builtin.command: pkill -x cage
  register: pve_screen_pkill
  # pkill exits 1 when nothing matched, which is the normal case on a first run
  # or a box whose screen was never started.
  failed_when: pve_screen_pkill.rc not in [0, 1]
  changed_when: pve_screen_pkill.rc == 0

- name: Reload systemd after removing the kiosk
  ansible.builtin.systemd_service:
    daemon_reload: true
