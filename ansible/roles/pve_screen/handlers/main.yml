---
# Named distinctly from every other role's handlers: handler names are
# play-global, so anything generic would collide silently.

- name: Restart the screen session
  # Restart the GETTY, not the browser.
  #
  # `pkill cage` looks like the obvious move and is wrong: the launch line is
  # `cage -- cog URL || btop`, so killing cage does not re-read anything — the
  # shell simply falls through to the `|| btop` fallback and sits there. The
  # screen ends up showing btop, the profile's new URL is never used, and
  # nothing says so. Observed exactly that way on the first run of this role,
  # with the old URL still on the glass and cage still alive.
  #
  # Restarting getty@tty1 ends the login session, so agetty respawns it,
  # autologin runs .bash_profile again, and cage starts against whatever URL
  # was just written.
  ansible.builtin.systemd_service:
    name: getty@tty1.service
    state: restarted

- name: Reload systemd after removing the kiosk
  ansible.builtin.systemd_service:
    daemon_reload: true
