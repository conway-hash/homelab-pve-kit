---
# One play per host group. Adding a service later means adding a play here
# and a roles/svc_<name>/ role — never a new workflow file, because CI
# matrixes over the groups in this file.

- name: Converge the Proxmox hypervisor
  hosts: pve_host
  become: true
  gather_facts: true

  roles:
    - pve_host

