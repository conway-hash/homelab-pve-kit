[defaults]
inventory            = inventory/hosts.ini
roles_path           = roles
host_key_checking    = True
retry_files_enabled  = False
interpreter_python   = auto_silent

[ssh_connection]
pipelining = True
ssh_args = -C -o ControlMaster=auto -o ControlPersist=15m
# Let Ansible own the control-socket directory — it creates this itself.
# Hand-rolling a ControlPath in the inventory means every caller has to
# remember to mkdir it first, which is a footgun that already bit once.
control_path_dir = ~/.ansible/cp
