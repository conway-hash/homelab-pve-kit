name: Deploy

on:
  push:
    branches: [main]
    paths:
      - "ansible/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deploy-pve
  cancel-in-progress: false

jobs:
  # Gate. Reuses ansible-lint.yml rather than copying its steps, so there
  # is one definition of what "lint" means for this repo.
  lint:
    uses: ./.github/workflows/ansible-lint.yml

  # The matrix is derived from site.yml's own `hosts:` lines crossed with the
  # service switches, rather than hardcoded here. Adding a service means adding
  # a play in site.yml, a roles/svc_<name>/ role and a line in services.yml —
  # this workflow file is never touched again.
  groups:
    runs-on: ubuntu-latest
    outputs:
      guests: ${{ steps.detect.outputs.guests }}
    steps:
      - uses: actions/checkout@v7

      - run: pip install --quiet pyyaml

      - id: detect
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, pathlib, re, sys
          import yaml

          site = pathlib.Path("ansible/site.yml").read_text()
          groups = re.findall(r"^\s+hosts:\s*(\S+)\s*$", site, re.M)
          if not groups:
              sys.exit("::error::No host groups found in ansible/site.yml")

          flags = yaml.safe_load(
              pathlib.Path("ansible/group_vars/all/services.yml").read_text()
          )["service_enabled"]

          guests, skipped = [], []
          for group in groups:
              # The hypervisor is not a service and is not in this list — it is
              # deployed by its own job, always, before any guest. There is no
              # switch for the machine everything else runs on.
              if group == "pve_host":
                  continue

              # Convention, and the reason the matrix needs no mapping table:
              # a guest group is <service>_host.
              name = group[: -len("_host")] if group.endswith("_host") else group
              if name not in flags:
                  # Loud, because the alternative is silent. A typo in either
                  # file would otherwise mean a service that quietly never
                  # deploys, or one that deploys with nothing able to turn it
                  # off.
                  sys.exit(
                      f"::error::site.yml has a play for '{group}' but "
                      f"services.yml has no '{name}' entry. Add one, or the "
                      f"service has no switch."
                  )
              (guests if flags[name] else skipped).append(group)

          for group in skipped:
              print(f"::notice::skipping {group} — switched off in services.yml", file=sys.stderr)
          print("Guests to deploy:", guests, file=sys.stderr)
          print(f"guests={json.dumps(guests, separators=(',', ':'))}")
          PY

  # The hypervisor first, on its own, because it is what CREATES the guests.
  # This used to be guaranteed by a separate tofu-apply job; when that went
  # away the guest legs started racing the job that builds them, and a guest
  # play would fail as UNREACHABLE against a VM that did not exist yet.
  # The hypervisor first, on its own, because it is what CREATES the guests.
  # That ordering used to come free from a separate tofu-apply job; when that
  # went away the guest legs started racing the job that builds them, and a
  # guest play failed as UNREACHABLE against a VM that did not exist yet.
  deploy-hypervisor:
    needs: [lint, groups]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ansible
    steps:
      - uses: actions/checkout@v7

      - name: Install Ansible + collections
        run: |
          pipx install --include-deps ansible

          # community.proxmox's modules import proxmoxer, and they run on the
          # CONTROLLER (this runner) rather than the hypervisor — Debian trixie
          # ships proxmoxer 2.2.0 and the modules need >= 2.3, so installing it
          # on a machine meant to stay minimal was the wrong trade.
          #
          # Install it into whichever interpreter ansible-playbook ACTUALLY
          # uses, read from its shebang. `pipx inject ansible` looks right and
          # is not: these runners ship ansible-core in its own pipx venv, that
          # copy wins on PATH, and the injection lands in a venv nothing runs.
          # The failure is a module-level ImportError a long way from the cause.
          # awk takes the interpreter only: the shebang is `#!<path>/python -E`
          # on these images, and passing the flag along as part of the path
          # makes the next line an exit-127 "No such file or directory".
          ANSIBLE_PY=$(head -1 "$(command -v ansible-playbook)" | sed 's|^#!||' | awk '{print $1}')
          echo "ansible runs on: $ANSIBLE_PY"
          "$ANSIBLE_PY" -m pip install --quiet 'proxmoxer>=2.3' requests
          "$ANSIBLE_PY" -c 'import proxmoxer; print("proxmoxer", proxmoxer.__version__)'
          ansible-galaxy collection install -r requirements.yml
          # For the smoke test, which reads the switches to know which guests
          # are meant to be up.
          pip install --quiet pyyaml

      - name: Join the tailnet
        # These hosts sit on a home LAN with no public address — the only
        # way in is the tailnet itself. The key must be ephemeral and
        # reusable: this node is a throwaway that should disappear on its
        # own, which is a different scope from the non-ephemeral key a
        # permanent machine joins with. Don't reuse one for the other.
        # Through the environment, not interpolated into the script text —
        # see "Write the vault secrets" for why that distinction matters.
        env:
          PVE_SSH_PRIVATE_KEY: ${{ secrets.PVE_SSH_PRIVATE_KEY }}
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
        run: |
          # `tailscale up` with an empty authkey does not fail — it prints a
          # login URL and BLOCKS waiting for a human, burning the whole job
          # timeout. Fail fast and name the fix instead.
          if [ -z "${TS_AUTHKEY}" ]; then
            echo "::error::TS_AUTHKEY is not set. Mint an ephemeral+reusable Headscale pre-auth key and add it as a repo secret — see SETUP.md step 4."
            exit 1
          fi
          if [ -z "${PVE_SSH_PRIVATE_KEY}" ]; then
            echo "::error::PVE_SSH_PRIVATE_KEY is not set — see SETUP.md step 4."
            exit 1
          fi

          curl -fsSL https://tailscale.com/install.sh | sh
          LOGIN=$(grep '^headscale_server_url:' group_vars/all/vars.yml \
            | sed 's/^headscale_server_url:[[:space:]]*//; s/[[:space:]]*#.*$//')
          sudo tailscale up \
            --timeout=60s \
            --login-server="$LOGIN" \
            --authkey="${TS_AUTHKEY}" \
            --hostname="gh-runner-${GITHUB_RUN_ID}" \
            --accept-dns=true
          tailscale status

      - name: Write the deploy SSH key
        # Through the environment, not interpolated into the script text —
        # see "Write the vault secrets" for why that distinction matters.
        env:
          PVE_SSH_PRIVATE_KEY: ${{ secrets.PVE_SSH_PRIVATE_KEY }}
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "${PVE_SSH_PRIVATE_KEY}" > ~/.ssh/homelab_ci_deploy
          chmod 600 ~/.ssh/homelab_ci_deploy

      - name: Write the inventory
        run: |
          cp inventory/hosts.ini.example inventory/hosts.ini

      # Only the hypervisor play creates guests, so only that leg needs the
      # Proxmox API token.
      - name: Write the hypervisor secrets
        # Through the environment, not interpolated into the script text —
        # see "Write the vault secrets" for why that distinction matters.
        env:
          PVE_API_TOKEN_SECRET: ${{ secrets.PVE_API_TOKEN_SECRET }}
        run: |
          if [ -z "${PVE_API_TOKEN_SECRET}" ]; then
            echo "::error::PVE_API_TOKEN_SECRET is not set — no guest can be created. See docs/README.md."
            exit 1
          fi

          umask 077
          # The guest SSH key is DERIVED from the deploy key rather than kept as
          # a second secret. One keypair, one place it lives, no way for the two
          # halves to drift.
          {
            printf 'pve_guests_api_token_secret: "%s"\n' "${PVE_API_TOKEN_SECRET}"
            printf 'pve_guests_ssh_public_key: "%s"\n' "$(ssh-keygen -y -f ~/.ssh/homelab_ci_deploy)"
          } > group_vars/pve_host/secrets.yml

      # Written straight before the playbook and scoped to just this matrix
      # leg, so the vault's credentials never exist in a job that deploys
      # something else. Never committed; the real file is git-ignored.
      - name: Run playbook
        run: ansible-playbook site.yml --limit "pve_host"

      - name: Smoke test — hypervisor
        run: |
          FAILED=0

          # pvesh returns `notify` as an object, not the "key=value" string
          # the CLI accepts as input — read the field, don't grep the blob.
          NOTIFY=$(ssh -i ~/.ssh/homelab_ci_deploy -o StrictHostKeyChecking=accept-new \
            ci-deploy@pve.ts.conway-hash.com \
            'sudo pvesh get /cluster/options --output-format json' \
            | jq -r '.notify["package-updates"] // ""')
          if [ "$NOTIFY" = "always" ]; then
            echo "OK: package-updates=always"
          else
            echo "::error::package-updates is '$NOTIFY', expected 'always' — nightly update checks report to nobody"
            FAILED=1
          fi

          if ssh -i ~/.ssh/homelab_ci_deploy -o StrictHostKeyChecking=accept-new \
            ci-deploy@pve.ts.conway-hash.com 'apt-config dump >/dev/null 2>&1'; then
            echo "OK: apt config parses"
          else
            echo "::error::apt config is malformed — every apt invocation on the host is now broken"
            FAILED=1
          fi

          # Every switched-on guest must actually exist and be running. Without
          # this, a play that reported ok while creating nothing would only be
          # caught by the NEXT job failing to SSH into a machine that was never
          # built — a confusing error a long way from its cause.
          python3 - <<'PY' > /tmp/enabled-vmids
          import yaml
          flags = yaml.safe_load(open("group_vars/all/services.yml"))["service_enabled"]
          guests = yaml.safe_load(open("group_vars/pve_host/vars.yml"))["pve_guests"]
          print(" ".join(str(g["vmid"]) for g in guests if flags.get(g["service"])))
          PY

          for VMID in $(cat /tmp/enabled-vmids); do
            STATUS=$(ssh -i ~/.ssh/homelab_ci_deploy -o StrictHostKeyChecking=accept-new \
              ci-deploy@pve.ts.conway-hash.com "sudo qm status $VMID 2>/dev/null" \
              | awk '{print $2}')
            if [ "$STATUS" = "running" ]; then
              echo "OK: VM $VMID is running"
            else
              echo "::error::VM $VMID is '${STATUS:-missing}', expected 'running'"
              FAILED=1
            fi
          done

          exit $FAILED

      # Without this the runner just vanishes and headscale waits out
      # ephemeral.inactivity_timeout (30m) before reaping the node — which
      # leaves a dead entry holding a tailnet IP for half an hour after
      # every deploy. Logging out makes headscale drop it immediately.
      # always(), so a failed deploy doesn't leave one behind either.
      - name: Leave the tailnet
        if: always()
        run: |
          sudo tailscale logout \
            || echo "::warning::tailscale logout failed; headscale will reap this node after its inactivity timeout"

  # Guests, in parallel with each other but only once the hypervisor job has
  # finished creating them. Switched-off services are already absent from this
  # matrix, so a disabled guest is never even attempted.
  deploy-guests:
    needs: [lint, groups, deploy-hypervisor]
    if: needs.groups.outputs.guests != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        host: ${{ fromJson(needs.groups.outputs.guests) }}
    defaults:
      run:
        working-directory: ansible
    steps:
      - uses: actions/checkout@v7

      - name: Install Ansible + collections
        run: |
          pipx install --include-deps ansible

          # community.proxmox's modules import proxmoxer, and they run on the
          # CONTROLLER (this runner) rather than the hypervisor — Debian trixie
          # ships proxmoxer 2.2.0 and the modules need >= 2.3, so installing it
          # on a machine meant to stay minimal was the wrong trade.
          #
          # Install it into whichever interpreter ansible-playbook ACTUALLY
          # uses, read from its shebang. `pipx inject ansible` looks right and
          # is not: these runners ship ansible-core in its own pipx venv, that
          # copy wins on PATH, and the injection lands in a venv nothing runs.
          # The failure is a module-level ImportError a long way from the cause.
          # awk takes the interpreter only: the shebang is `#!<path>/python -E`
          # on these images, and passing the flag along as part of the path
          # makes the next line an exit-127 "No such file or directory".
          ANSIBLE_PY=$(head -1 "$(command -v ansible-playbook)" | sed 's|^#!||' | awk '{print $1}')
          echo "ansible runs on: $ANSIBLE_PY"
          "$ANSIBLE_PY" -m pip install --quiet 'proxmoxer>=2.3' requests
          "$ANSIBLE_PY" -c 'import proxmoxer; print("proxmoxer", proxmoxer.__version__)'
          ansible-galaxy collection install -r requirements.yml
          # For the smoke test, which reads the switches to know which guests
          # are meant to be up.
          pip install --quiet pyyaml

      - name: Join the tailnet
        # These hosts sit on a home LAN with no public address — the only
        # way in is the tailnet itself. The key must be ephemeral and
        # reusable: this node is a throwaway that should disappear on its
        # own, which is a different scope from the non-ephemeral key a
        # permanent machine joins with. Don't reuse one for the other.
        # Through the environment, not interpolated into the script text —
        # see "Write the vault secrets" for why that distinction matters.
        env:
          PVE_SSH_PRIVATE_KEY: ${{ secrets.PVE_SSH_PRIVATE_KEY }}
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
        run: |
          # `tailscale up` with an empty authkey does not fail — it prints a
          # login URL and BLOCKS waiting for a human, burning the whole job
          # timeout. Fail fast and name the fix instead.
          if [ -z "${TS_AUTHKEY}" ]; then
            echo "::error::TS_AUTHKEY is not set. Mint an ephemeral+reusable Headscale pre-auth key and add it as a repo secret — see SETUP.md step 4."
            exit 1
          fi
          if [ -z "${PVE_SSH_PRIVATE_KEY}" ]; then
            echo "::error::PVE_SSH_PRIVATE_KEY is not set — see SETUP.md step 4."
            exit 1
          fi

          curl -fsSL https://tailscale.com/install.sh | sh
          LOGIN=$(grep '^headscale_server_url:' group_vars/all/vars.yml \
            | sed 's/^headscale_server_url:[[:space:]]*//; s/[[:space:]]*#.*$//')
          sudo tailscale up \
            --timeout=60s \
            --login-server="$LOGIN" \
            --authkey="${TS_AUTHKEY}" \
            --hostname="gh-runner-${GITHUB_RUN_ID}" \
            --accept-dns=true
          tailscale status

      - name: Write the deploy SSH key
        # Through the environment, not interpolated into the script text —
        # see "Write the vault secrets" for why that distinction matters.
        env:
          PVE_SSH_PRIVATE_KEY: ${{ secrets.PVE_SSH_PRIVATE_KEY }}
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "${PVE_SSH_PRIVATE_KEY}" > ~/.ssh/homelab_ci_deploy
          chmod 600 ~/.ssh/homelab_ci_deploy

      - name: Write the inventory
        run: |
          cp inventory/hosts.ini.example inventory/hosts.ini

      # Scoped to the VAULT leg specifically, not merely to the guest job.
      # Without the `if`, every guest matrix leg wrote the vault's credentials
      # to disk — so adding a second service quietly handed it a copy of the
      # vault's admin token and Cloudflare credential for the length of the run.
      - name: Write the vault secrets
        if: matrix.host == 'vault_host'
        # Secrets come through the environment, never interpolated into the
        # script text. GitHub substitutes ${{ secrets.X }} into the shell source
        # BEFORE bash parses it, so a secret containing $ — an Argon2 hash, for
        # instance — turns into shell variable expansions and arrives empty.
        # That is not hypothetical: it silently truncated the vault's admin
        # token to a 59-character fragment with every $-segment gone.
        env:
          SVC_VAULTWARDEN_ADMIN_TOKEN: ${{ secrets.SVC_VAULTWARDEN_ADMIN_TOKEN }}
          SVC_VAULTWARDEN_CLOUDFLARE_API_TOKEN: ${{ secrets.SVC_VAULTWARDEN_CLOUDFLARE_API_TOKEN }}
          SVC_VAULTWARDEN_TS_AUTHKEY: ${{ secrets.SVC_VAULTWARDEN_TS_AUTHKEY }}
        run: |
          if [ -z "${SVC_VAULTWARDEN_ADMIN_TOKEN}" ]; then
            echo "::error::SVC_VAULTWARDEN_ADMIN_TOKEN is not set — see docs/vault.md."
            exit 1
          fi
          if [ -z "${SVC_VAULTWARDEN_CLOUDFLARE_API_TOKEN}" ]; then
            echo "::error::SVC_VAULTWARDEN_CLOUDFLARE_API_TOKEN is not set. Caddy cannot obtain a certificate without it, and every Bitwarden client refuses a non-HTTPS server — see docs/vault.md."
            exit 1
          fi

          umask 077
          # SVC_VAULTWARDEN_TS_AUTHKEY is deliberately NOT required. It is only needed to
          # put the guest on the tailnet the first time; after that the
          # tailscale role sees an existing join and skips it, so routine
          # deploys run with the secret absent and empty is the correct value.
          #
          # It is also a DIFFERENT scope from TS_AUTHKEY above: this one must be
          # non-ephemeral, because the vault is a permanent machine and an
          # ephemeral key would make it delete itself the moment it disconnects.
          # printf rather than a heredoc, so re-indenting this block later
          # cannot change what lands in the file — heredoc bodies are literal,
          # and YAML's indent stripping is not obvious enough to bet a secrets
          # file on.
          {
            printf 'tailscale_authkey: "%s"\n'       "${SVC_VAULTWARDEN_TS_AUTHKEY}"
            printf 'svc_vaultwarden_admin_token: "%s"\n' "${SVC_VAULTWARDEN_ADMIN_TOKEN}"
            printf 'svc_vaultwarden_cloudflare_api_token: "%s"\n'    "${SVC_VAULTWARDEN_CLOUDFLARE_API_TOKEN}"
          } > group_vars/vault_host/secrets.yml

      # Its own step, its own `if`, its own secrets — see docs/links.md on why
      # the Cloudflare token is a SEPARATE one from the vault's rather than a
      # share of it.
      - name: Write the links secrets
        if: matrix.host == 'links_host'
        # Through the environment, never interpolated into the script text:
        # GitHub substitutes ${{ secrets.X }} into shell SOURCE before bash
        # parses it, so a base64 secret containing $ becomes a variable
        # expansion and arrives mangled. That is not hypothetical — it
        # silently truncated the vault's admin token once already.
        env:
          SVC_LINKWARDEN_NEXTAUTH_SECRET: ${{ secrets.SVC_LINKWARDEN_NEXTAUTH_SECRET }}
          SVC_LINKWARDEN_POSTGRES_PASSWORD: ${{ secrets.SVC_LINKWARDEN_POSTGRES_PASSWORD }}
          SVC_LINKWARDEN_MEILI_MASTER_KEY: ${{ secrets.SVC_LINKWARDEN_MEILI_MASTER_KEY }}
          SVC_LINKWARDEN_CLOUDFLARE_API_TOKEN: ${{ secrets.SVC_LINKWARDEN_CLOUDFLARE_API_TOKEN }}
          SVC_LINKWARDEN_TS_AUTHKEY: ${{ secrets.SVC_LINKWARDEN_TS_AUTHKEY }}
        run: |
          for VAR in SVC_LINKWARDEN_NEXTAUTH_SECRET \
                     SVC_LINKWARDEN_POSTGRES_PASSWORD \
                     SVC_LINKWARDEN_MEILI_MASTER_KEY \
                     SVC_LINKWARDEN_CLOUDFLARE_API_TOKEN; do
            if [ -z "${!VAR}" ]; then
              echo "::error::${VAR} is not set — see docs/links.md."
              exit 1
            fi
          done

          umask 077
          # SVC_LINKWARDEN_TS_AUTHKEY is deliberately NOT required: it is only
          # needed to put the guest on the tailnet the first time, and after
          # that the tailscale role sees an existing join and skips it. It is
          # also a DIFFERENT scope from the TS_AUTHKEY the runner joins with —
          # non-ephemeral, because this is a permanent machine.
          #
          # printf rather than a heredoc, so re-indenting this block later
          # cannot change what lands in the file.
          {
            printf 'tailscale_authkey: "%s"\n'                        "${SVC_LINKWARDEN_TS_AUTHKEY}"
            printf 'svc_linkwarden_nextauth_secret: "%s"\n'           "${SVC_LINKWARDEN_NEXTAUTH_SECRET}"
            printf 'svc_linkwarden_postgres_password: "%s"\n'         "${SVC_LINKWARDEN_POSTGRES_PASSWORD}"
            printf 'svc_linkwarden_meili_master_key: "%s"\n'          "${SVC_LINKWARDEN_MEILI_MASTER_KEY}"
            printf 'svc_linkwarden_cloudflare_api_token: "%s"\n'      "${SVC_LINKWARDEN_CLOUDFLARE_API_TOKEN}"
          } > group_vars/links_host/secrets.yml

      - name: Write the finance secrets
        if: matrix.host == 'finance_host'
        # Through the environment, never interpolated into the script text —
        # GitHub substitutes ${{ secrets.X }} into shell SOURCE before bash
        # parses it, so a base64 secret containing $ arrives mangled.
        env:
          SVC_FIREFLY_APP_KEY: ${{ secrets.SVC_FIREFLY_APP_KEY }}
          SVC_FIREFLY_CRON_TOKEN: ${{ secrets.SVC_FIREFLY_CRON_TOKEN }}
          SVC_FIREFLY_POSTGRES_PASSWORD: ${{ secrets.SVC_FIREFLY_POSTGRES_PASSWORD }}
          SVC_FIREFLY_CLOUDFLARE_API_TOKEN: ${{ secrets.SVC_FIREFLY_CLOUDFLARE_API_TOKEN }}
          SVC_FIREFLY_TS_AUTHKEY: ${{ secrets.SVC_FIREFLY_TS_AUTHKEY }}
          SVC_FIREFLY_ACCESS_TOKEN: ${{ secrets.SVC_FIREFLY_ACCESS_TOKEN }}
          SVC_FIREFLY_EB_APP_ID: ${{ secrets.SVC_FIREFLY_EB_APP_ID }}
          SVC_FIREFLY_EB_PRIVATE_KEY: ${{ secrets.SVC_FIREFLY_EB_PRIVATE_KEY }}
        run: |
          for VAR in SVC_FIREFLY_APP_KEY \
                     SVC_FIREFLY_CRON_TOKEN \
                     SVC_FIREFLY_POSTGRES_PASSWORD \
                     SVC_FIREFLY_CLOUDFLARE_API_TOKEN; do
            if [ -z "${!VAR}" ]; then
              echo "::error::${VAR} is not set — see docs/finance.md."
              exit 1
            fi
          done

          # Length is checked here as well as in the role, because getting it
          # wrong is silent: Firefly accepts a short key and then fails when
          # something is decrypted, a long way from the cause.
          if [ ${#SVC_FIREFLY_APP_KEY} -ne 32 ]; then
            echo "::error::SVC_FIREFLY_APP_KEY must be exactly 32 characters, is ${#SVC_FIREFLY_APP_KEY}."
            exit 1
          fi
          if [ ${#SVC_FIREFLY_CRON_TOKEN} -ne 32 ]; then
            echo "::error::SVC_FIREFLY_CRON_TOKEN must be exactly 32 characters, is ${#SVC_FIREFLY_CRON_TOKEN}."
            exit 1
          fi

          umask 077
          {
            printf 'tailscale_authkey: "%s"\n'                    "${SVC_FIREFLY_TS_AUTHKEY}"
            printf 'svc_firefly_app_key: "%s"\n'                  "${SVC_FIREFLY_APP_KEY}"
            printf 'svc_firefly_cron_token: "%s"\n'               "${SVC_FIREFLY_CRON_TOKEN}"
            printf 'svc_firefly_postgres_password: "%s"\n'        "${SVC_FIREFLY_POSTGRES_PASSWORD}"
            printf 'svc_firefly_cloudflare_api_token: "%s"\n'     "${SVC_FIREFLY_CLOUDFLARE_API_TOKEN}"
            # The importer trio. Absent is fine — the role asserts they are
            # all set or all unset, so an importer that is not configured yet
            # simply is not configured, rather than half-configured.
            printf 'svc_firefly_access_token: "%s"\n'            "${SVC_FIREFLY_ACCESS_TOKEN}"
            printf 'svc_firefly_eb_app_id: "%s"\n'               "${SVC_FIREFLY_EB_APP_ID}"
            printf 'svc_firefly_eb_private_key: "%s"\n'          "${SVC_FIREFLY_EB_PRIVATE_KEY}"
          } > group_vars/finance_host/secrets.yml

      - name: Run playbook
        run: ansible-playbook site.yml --limit "${{ matrix.host }}"

      - name: Smoke test — vault
        if: matrix.host == 'vault_host'
        run: |
          FAILED=0

          DOMAIN="vault.$(grep '^tailnet_base_domain:' group_vars/all/vars.yml \
            | sed 's/^tailnet_base_domain:[[:space:]]*//; s/[[:space:]]*#.*$//')"

          # The check a real client makes, from off-box, over the tailnet:
          # MagicDNS resolves the name, Caddy answers with a certificate that
          # verifies against the public trust store, and Vaultwarden is awake
          # behind it. No -k anywhere — an unverifiable certificate is one of
          # the two outages this is here to catch, so it has to fail.
          if curl -fsS --max-time 30 "https://${DOMAIN}/alive" >/dev/null; then
            echo "OK: ${DOMAIN} answers over verified HTTPS"
          else
            echo "::error::${DOMAIN}/alive did not answer over verified HTTPS — the vault is unreachable by every Bitwarden client"
            FAILED=1
          fi

          # Registration being open would let anything that reaches the tailnet
          # create an account on the vault server.
          #
          # Read from the RUNNING container, not from /api/config: Vaultwarden
          # stopped exposing the signups flag there, so the previous version of
          # this check quietly degraded to a warning and verified nothing. A
          # check that cannot fail is worse than no check, because it reads
          # like coverage.
          SIGNUPS=$(ssh -i ~/.ssh/homelab_ci_deploy -o StrictHostKeyChecking=accept-new \
            ci-deploy@"${DOMAIN}" \
            'sudo docker exec vaultwarden printenv SIGNUPS_ALLOWED' 2>/dev/null | tr -d '\r')
          if [ "$SIGNUPS" = "false" ]; then
            echo "OK: signups are closed"
          else
            echo "::error::SIGNUPS_ALLOWED is '${SIGNUPS:-unreadable}', expected 'false' — anyone on the tailnet can register on your vault"
            FAILED=1
          fi

          # The self-heal timer is the only thing covering "running but not
          # answering". If it is not armed, that failure mode is uncovered and
          # nothing else in this job would notice.
          # Straight to the tailnet name, not through the hypervisor. The
          # inventory jumps via pve so a guest with a broken tailnet join is
          # still fixable; a smoke test wants the opposite — if the vault is not
          # reachable the way a client reaches it, that is a failure, not
          # something to route around.
          if ssh -i ~/.ssh/homelab_ci_deploy -o StrictHostKeyChecking=accept-new \
            ci-deploy@"${DOMAIN}" \
            'systemctl is-active --quiet vaultwarden-healthcheck.timer'; then
            echo "OK: self-heal timer is active"
          else
            echo "::error::vaultwarden-healthcheck.timer is not active — a wedged stack would never be restarted"
            FAILED=1
          fi

          exit $FAILED

      - name: Smoke test — links
        if: matrix.host == 'links_host'
        run: |
          FAILED=0

          DOMAIN="links.$(grep '^tailnet_base_domain:' group_vars/all/vars.yml \
            | sed 's/^tailnet_base_domain:[[:space:]]*//; s/[[:space:]]*#.*$//')"

          # The check a real browser makes, from off-box, over the tailnet.
          # No -k anywhere — an unverifiable certificate has to fail. Not -L
          # either: an unauthenticated request is answered with a redirect to
          # the login page, and that redirect IS the app being alive.
          if curl -fsS --max-time 30 "https://${DOMAIN}/" >/dev/null; then
            echo "OK: ${DOMAIN} answers over verified HTTPS"
          else
            echo "::error::${DOMAIN} did not answer over verified HTTPS"
            FAILED=1
          fi

          # Registration being open would let anything reaching the tailnet
          # create itself an account on your bookmark archive. Read from the
          # RUNNING container rather than from any public endpoint, so this
          # cannot quietly degrade into a check that verifies nothing.
          REG=$(ssh -i ~/.ssh/homelab_ci_deploy -o StrictHostKeyChecking=accept-new \
            ci-deploy@"${DOMAIN}" \
            'sudo docker exec linkwarden printenv NEXT_PUBLIC_DISABLE_REGISTRATION' 2>/dev/null | tr -d '\r')
          if [ "$REG" = "true" ]; then
            echo "OK: registration is closed"
          else
            echo "::error::NEXT_PUBLIC_DISABLE_REGISTRATION is '${REG:-unreadable}', expected 'true' — anyone on the tailnet can register"
            FAILED=1
          fi

          # 443 must NOT be listening on 0.0.0.0. This is the bug the vault
          # shipped with: a bare "443:443" published the service to every
          # device on the home LAN while every doc claimed tailnet-only.
          if ssh -i ~/.ssh/homelab_ci_deploy -o StrictHostKeyChecking=accept-new \
            ci-deploy@"${DOMAIN}" \
            'sudo docker port linkwarden-caddy' 2>/dev/null | grep -q '0\.0\.0\.0:443'; then
            echo "::error::linkwarden-caddy publishes 443 on 0.0.0.0 — the archive is exposed to the whole LAN, not just the tailnet"
            FAILED=1
          else
            echo "OK: 443 is not published on 0.0.0.0"
          fi

          # The self-heal timer is the only thing covering "running but not
          # answering". If it is not armed, that failure mode is uncovered.
          if ssh -i ~/.ssh/homelab_ci_deploy -o StrictHostKeyChecking=accept-new \
            ci-deploy@"${DOMAIN}" \
            'systemctl is-active --quiet linkwarden-healthcheck.timer'; then
            echo "OK: self-heal timer is active"
          else
            echo "::error::linkwarden-healthcheck.timer is not active — a wedged stack would never be restarted"
            FAILED=1
          fi

          exit $FAILED

      - name: Smoke test — finance
        if: matrix.host == 'finance_host'
        run: |
          FAILED=0

          DOMAIN="finance.$(grep '^tailnet_base_domain:' group_vars/all/vars.yml \
            | sed 's/^tailnet_base_domain:[[:space:]]*//; s/[[:space:]]*#.*$//')"

          # What a browser does, from off-box, over the tailnet. No -k: an
          # unverifiable certificate has to fail.
          if curl -fsS --max-time 30 "https://${DOMAIN}/" >/dev/null; then
            echo "OK: ${DOMAIN} answers over verified HTTPS"
          else
            echo "::error::${DOMAIN} did not answer over verified HTTPS"
            FAILED=1
          fi

          # 443 must NOT be on 0.0.0.0 — the bug the vault shipped with, which
          # here would put every transaction you own on the home LAN.
          if ssh -i ~/.ssh/homelab_ci_deploy -o StrictHostKeyChecking=accept-new \
            ci-deploy@"${DOMAIN}" \
            'sudo docker port firefly-caddy' 2>/dev/null | grep -q '0\.0\.0\.0:443'; then
            echo "::error::firefly-caddy publishes 443 on 0.0.0.0 — exposed to the whole LAN"
            FAILED=1
          else
            echo "OK: 443 is not published on 0.0.0.0"
          fi

          # Both timers, because both fail silently. Without the cron one,
          # recurring transactions and rules simply never run and nothing says so.
          for T in firefly-healthcheck.timer firefly-cron.timer; do
            if ssh -i ~/.ssh/homelab_ci_deploy -o StrictHostKeyChecking=accept-new \
              ci-deploy@"${DOMAIN}" "systemctl is-active --quiet $T"; then
              echo "OK: $T is active"
            else
              echo "::error::$T is not active"
              FAILED=1
            fi
          done

          exit $FAILED

      # Without this the runner just vanishes and headscale waits out
      # ephemeral.inactivity_timeout (30m) before reaping the node — which
      # leaves a dead entry holding a tailnet IP for half an hour after
      # every deploy. Logging out makes headscale drop it immediately.
      # always(), so a failed deploy doesn't leave one behind either.
      - name: Leave the tailnet
        if: always()
        run: |
          sudo tailscale logout \
            || echo "::warning::tailscale logout failed; headscale will reap this node after its inactivity timeout"
