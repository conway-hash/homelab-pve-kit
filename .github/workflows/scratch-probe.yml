name: Scratch Probe
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - host: vault_host
            secret_name: TS_AUTHKEY
    steps:
      - name: Index the secrets context with a matrix value
        env:
          PICKED: ${{ secrets[matrix.secret_name] }}
        run: |
          echo "host=${{ matrix.host }} secret_name=${{ matrix.secret_name }}"
          echo "resolved to ${#PICKED} chars"
          if [ "${#PICKED}" -gt 0 ]; then echo "DYNAMIC INDEXING WORKS"; else echo "resolved EMPTY"; fi
