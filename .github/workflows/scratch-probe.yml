name: Scratch Probe
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - host: vault_host
            service: vault
    environment: ${{ matrix.service }}
    steps:
      - name: Uniformly-named secret resolved per environment
        env:
          SERVICE_SECRETS: ${{ secrets.SERVICE_SECRETS }}
        run: |
          echo "service=${{ matrix.service }}"
          echo "bytes=${#SERVICE_SECRETS}"
          python3 -c "
          import os, yaml
          d = yaml.safe_load(os.environ['SERVICE_SECRETS']) or {}
          print('parsed keys:', sorted(d))
          print('ENVIRONMENT SCOPING WORKS' if d.get('probe_value') == 'hello-from-environment' else 'MISMATCH')
          "
