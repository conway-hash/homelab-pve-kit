name: Scratch Probe
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Control — one named secret, no toJSON
        env:
          ONE_SECRET: ${{ secrets.TS_AUTHKEY }}
        run: |
          echo "control ran; secret is ${#ONE_SECRET} chars"
